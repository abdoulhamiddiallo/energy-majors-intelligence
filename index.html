        ${v.third ? '<span class="pill warn" style="margin-left:6px">market data</span>' : ''}
        ${v.weak ? '<span class="pill crit" style="margin-left:6px">not confirmed at source</span>' : ''}</td>
    </tr>`).join('');
  const weak = VERIFY.filter(v => v.weak).length, third = VERIFY.filter(v => v.third).length;

  document.getElementById('content').innerHTML = `
    <div class="grid" style="grid-template-columns:1fr;margin-bottom:13px">
      ${card('Figure-by-figure verification', {
    sub: `Every headline 2025 figure, checked against the filing it comes from on ${VERIFIED_ON}. ` +
      `${VERIFY.length - third - weak} of ${VERIFY.length} entries are confirmed in a primary company document; ` +
      `${third} are market data, which no company publishes about itself; ${weak} could not be confirmed at source and say so.`,
    unit: 'audit trail',
    body: `<div style="max-height:520px;overflow-y:auto"><table class="dt"><thead><tr>
        <th style="text-align:left">Company</th><th style="text-align:left">Figure</th><th style="text-align:left">Value</th>
        <th style="text-align:left">Basis — what the number actually counts</th><th style="text-align:left">Source document</th>
      </tr></thead><tbody>${vRows}</tbody></table></div>`, bodyCls: 'tight',
    foot: `<p style="font-size:11px;color:var(--ink-3);margin:9px 0 0">A figure is only listed as verified when the value was read in the company's own results release, annual report, Form 10-K, 20-F or 6-K. Definitions are quoted rather than harmonised: where two companies count a metric differently, the difference is written in the basis column instead of being averaged away.</p>`
  })}
    </div>
    <div class="grid" style="grid-template-columns:1.05fr 1fr;align-items:start">
      ${card('Primary sources', { sub: 'Every figure in this application traces to one of these', body: `<div class="src-list">${SOURCES.map(s => `<div>· <a href="${s.url}" target="_blank" rel="noopener">${s.label}</a></div>`).join('')}</div>
        <p style="font-size:11.5px;color:var(--ink-2);line-height:1.65;margin-top:13px">Company figures come from annual reports, Form 20-F, Form 10-K and Form 6-K filings and quarterly results releases. Sustainability and emissions figures come from each company’s sustainability, climate or metrics disclosure. Historical Saudi crude output before 2018 comes from the U.S. Energy Information Administration.</p>` })}
      ${card('How to read the series', { body: `
        <div class="callout"><b>Units.</b> Production is thousand barrels of oil equivalent per day. Liquids are thousand barrels per day; natural gas is million cubic feet per day. Shell and bp convert gas at 5,800 scf/boe, Chevron and ExxonMobil at 6,000 — so the totals are not perfectly like-for-like.</div>
        <div class="callout"><b>Aramco before 2018.</b> Aramco published no company production figures before its 2019 IPO. The dashed segment is Saudi Arabia’s national crude output from the EIA, used as a proxy. It excludes NGL and gas, so it understates the company total. Read it as context, not as a disclosure.</div>
        <div class="callout"><b>bp before and after 2012.</b> TNK-BP ceased to be equity-accounted in October 2012, so the series steps down by roughly 1.1 mmboe/d for reasons of accounting, not geology.</div>
        <div class="callout"><b>ExxonMobil intensity.</b> ExxonMobil reports upstream GHG intensity in tonnes CO₂e per 100 tonnes of throughput, not kg per boe. Its line on the intensity chart is converted at a factor of about 1.35 and drawn dashed as a derived series. Its methane intensity uses a mass denominator rather than marketed gas, so it is left off that chart entirely rather than shown as a false comparison.</div>
        <div class="callout"><b>Currency.</b> Aramco reports in Saudi riyals; figures are converted at the pegged rate of 3.75 SAR/USD. TotalEnergies has presented its consolidated accounts in US dollars since 2016; earlier years are converted at prevailing rates by the underlying sources.</div>
        <div class="callout"><b>Emissions boundaries.</b> Aramco reports on wholly-owned operated assets; Chevron’s and ExxonMobil’s net-zero ambitions cover operated Scope 1 and 2 only; Shell, bp and TotalEnergies use wider boundaries. Scope 3 here is category 11, the use of sold products. Absolute totals are not directly comparable between companies.</div>
        <div class="callout"><b>How far back each series goes.</b> Aramco’s output is Saudi crude from 1949, on EIA and OPEC data before the company published anything of its own — it excludes NGL and gas. ExxonMobil is Exxon alone from 1994 and the merged company from 1999; Chevron is Chevron alone from 1991 and the merged company from 2001; bp is BP and Amoco combined from 1993. Those pre-merger stretches are drawn dashed, because the step at the merger year is an accounting event, not a change in the ground. Earlier still, no company published annual production in a form that can be verified today — what exists for the 1870–1948 period is the chronology, not a series.</div>
        <div class="callout"><b>Segment results are not one thing.</b> ExxonMobil, Chevron, Shell and TotalEnergies report a segment result after tax; bp reports underlying replacement-cost profit before interest and tax; Aramco reports EBIT before tax and royalties. That is why the segments page charts each company’s composition rather than a league table of absolute segment profit.</div>
        <div class="callout"><b>Geography is self-reported.</b> Every company draws its own map. ExxonMobil files one “Asia” geography covering Qatar, the UAE, Kazakhstan and South-East Asia; TotalEnergies files “Middle East and North Africa” and puts Kazakhstan and Russia inside Europe; Chevron discloses affiliate volumes without a geography. The mapping used here is stated company by company on the portfolio page, and where a company publishes no split at all its row says so rather than showing a guess.</div>
        <div class="callout"><b>Safety is the least comparable data here.</b> Recordable-injury denominators differ by a factor of five between companies, spill and flaring units differ, and Chevron’s performance data could not be retrieved at all. Those figures are shown per company with their units named, never summed or ranked as if they were one measure.</div>
        <div class="callout"><b>Gaps.</b> A dash always means “not disclosed”. Nothing in this model is interpolated or estimated except the Aramco proxy series and the ExxonMobil intensity conversion, both flagged wherever they appear.</div>` })}
    </div>
    <div class="grid" style="grid-template-columns:1fr;margin-top:13px">
      ${card('Colour, contrast and identity', { body: `<p style="font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:0">
        Each company keeps one fixed colour everywhere in the application, drawn from its own brand identity and then validated for colour-vision deficiency: the six-colour set clears an all-pairs CVD separation of ΔE 9.1 and a normal-vision separation of ΔE 17.7 against the chart surface. Two deviations are deliberate and documented. Shell’s gold falls below the 3:1 contrast threshold, so identity is never carried by colour alone — every series is direct-labelled at its last point, every legend carries the company emblem beside its colour key, and the full figures are available in the data explorer. ExxonMobil’s navy sits below the standard lightness band: it is <i>darker</i> than the band rather than lighter, which raises its contrast against the surface to 7.9:1, and it was chosen over ExxonMobil’s red because TotalEnergies already holds red and the two would have been indistinguishable to a protanope. Every company mark is embedded in the file itself, so the logos render identically online and offline. The ExxonMobil, TotalEnergies, Shell and Aramco marks are the artwork supplied by the user of this report; the bp and Chevron marks are drawn from each company's own brand geometry and colours. They are identity aids within this report, not reproductions of the registered trademarks.
      </p><p style="font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:11px 0 0">
        <b>Dark mode is a second palette, not an inversion.</b> Every series colour was re-stepped against the dark surface and put through the same validator: all six sit inside the dark lightness band, clear the chroma floor, hold an adjacent colour-vision separation of ΔE 11.7 against a target of 8, a normal-vision separation of ΔE 15.9 against a floor of 15, and reach 3:1 contrast against the surface. Aramco and TotalEnergies keep their exact brand colours in both themes; ExxonMobil’s navy is lifted and Shell’s gold stepped down, because at their brand values one is invisible on a dark surface and the other burns out. The theme follows your operating system on first open, can be switched from the header, and travels in the shareable link.
      </p><p style="font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:11px 0 0">
        <b>Keyboard and assistive technology.</b> A skip link is the first stop; every control is reachable by keyboard with a visible focus ring; every chart carries a text label naming it and its unit; table headers are marked as headers; motion is dropped for anyone who asks their system to reduce it. Body and label text clears 4.5:1 against its surface in both themes.
      </p>` })}
    </div>`;
}

/* ================================================================== RENDER */
const RENDERERS = { overview: pageOverview, map: pageMap, h2h: pageHeadToHead, benchmark: pageBenchmark, history: pageHistory, portfolio: pagePortfolio, segments: pageSegments, downstream: pageDownstream, safety: pageSafety, production: pageProduction, power: pagePower, financials: pageFinancials, climate: pageClimate, profiles: pageProfiles, data: pageData, sources: pageSources };

var render = function () {
  const p = PAGES.find(p => p.id === STATE.page);
  document.getElementById('pageTitle').textContent = p.label;
  document.getElementById('pageSub').textContent = p.sub;
  document.getElementById('filters').style.display = STATE.page === 'sources' ? 'none' : 'flex';
  document.getElementById('rangeWrap').style.display = ['overview', 'production', 'financials', 'climate', 'data', 'h2h'].includes(STATE.page) ? 'flex' : 'none';
  document.getElementById('chips').style.display = STATE.page === 'h2h' ? 'none' : 'flex';
  document.getElementById('content').scrollTop = 0;
  RENDERERS[STATE.page]();
  drawSideLegend();
  if (typeof a11yPass === 'function') a11yPass();
};

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 180); });

buildChrome();
render();
</script>
<script>/* ==========================================================================
   APP SHELL — command palette, shareable state, print
   ========================================================================== */

/* ------------------------------------------------------- shareable state */
function writeHash() {
  const co = STATE.active.size === COMPANIES.length ? 'all' : [...STATE.active].join(',');
  const h = `#p=${STATE.page}&c=${co}&y=${STATE.from}-${STATE.to}` +
    (typeof THEME !== 'undefined' && THEME === 'dark' ? '&t=dark' : '') +
    (STATE.page === 'h2h' ? `&h=${H2H.a},${H2H.b}` : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}
function readHash() {
  const q = Object.fromEntries(location.hash.replace(/^#/, '').split('&').filter(Boolean).map(s => s.split('=')));
  if (q.p && PAGES.some(p => p.id === q.p)) STATE.page = q.p;
  if (q.c) {
    const ids = q.c === 'all' ? COMPANIES.map(c => c.id) : q.c.split(',').filter(id => BYID[id]);
    if (ids.length) STATE.active = new Set(ids);
  }
  if (q.y && /^\d{4}-\d{4}$/.test(q.y)) {
    const [a, z] = q.y.split('-').map(Number);
    if (a >= 1949 && z <= LATEST && a <= z) { STATE.from = a; STATE.to = z; }
  }
  if (q.h) { const [a, b] = q.h.split(','); if (BYID[a] && BYID[b]) H2H = { a, b }; }
  if (q.t === 'dark' && typeof applyTheme === 'function') applyTheme('dark', false);
}

/* -------------------------------------------------------- command palette */
const CMD_STYLE = `
#cmd { position: fixed; inset: 0; z-index: 200; display: none; background: rgba(13,17,23,.44); backdrop-filter: blur(3px); }
#cmd.on { display: block; }
#cmd .cmd-box { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); width: min(620px, 92vw);
  background: var(--panel); border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.55); overflow: hidden; border: 1px solid var(--hair-strong); }
#cmd input { width: 100%; border: 0; padding: 17px 20px; font: inherit; font-size: 15px; outline: none; color: var(--ink-1); }
#cmd input::placeholder { color: var(--ink-3); }
#cmd .cmd-list { max-height: 56vh; overflow-y: auto; border-top: 1px solid var(--hair); padding: 6px; }
#cmd .cmd-sec { font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 700; padding: 10px 12px 5px; }
#cmd .cmd-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
#cmd .cmd-item .ci-sub { margin-left: auto; font-size: 10.5px; color: var(--ink-3); }
#cmd .cmd-item.sel { background: var(--ink-1); color: #fff; }
#cmd .cmd-item.sel .ci-sub { color: #a8b2bb; }
#cmd .cmd-foot { border-top: 1px solid var(--hair); padding: 8px 14px; font-size: 10.5px; color: var(--ink-3); display: flex; gap: 14px; }
#cmd kbd { background: var(--panel-2); border: 1px solid var(--hair-strong); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 5px; font-family: var(--font); font-size: 10px; font-weight: 600; }
.cmd-hint { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair-strong); background: #fff;
  border-radius: var(--r-sm); padding: 4px 9px; font-size: 11.5px; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
.cmd-hint:hover { border-color: var(--ink-3); color: var(--ink-1); }
@media print {
  #app { display: block; height: auto; overflow: visible; }
  .sidebar, .topbar, #cmd, #tip { display: none !important; }
  .content { overflow: visible !important; padding: 0 !important; }
  .card, .kpi, .profile-card, .hero, .insight { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; }
  .grid { gap: 10px; }
  body { background: #fff; }
}`;

const CMD = (() => {
  let items = [], sel = 0, node;
  const build = q => {
    const t = q.trim().toLowerCase();
    const hit = s => !t || s.toLowerCase().includes(t);
    const out = [];
    PAGES.filter(p => hit(p.label) || hit(p.sub)).forEach(p =>
      out.push({ sec: 'Pages', label: p.label, sub: p.sub.slice(0, 52), run: () => { STATE.page = p.id; syncNav(); render(); } }));
    COMPANIES.filter(c => hit(c.name) || hit(c.legal) || hit(c.hq)).forEach(c => {
      out.push({ sec: 'Companies', icon: LOGOS[c.id](18), label: 'Show only ' + c.short, sub: c.hq, run: () => { STATE.active = new Set([c.id]); syncChips(); render(); } });
      out.push({ sec: 'Companies', icon: LOGOS[c.id](18), label: (STATE.active.has(c.id) ? 'Hide ' : 'Add ') + c.short, sub: c.ticker, run: () => { STATE.active.has(c.id) ? (STATE.active.size > 1 && STATE.active.delete(c.id)) : STATE.active.add(c.id); syncChips(); render(); } });
      out.push({ sec: 'Companies', icon: LOGOS[c.id](18), label: c.short + ' profile', sub: 'founded ' + c.founded, run: () => { STATE.page = 'profiles'; STATE.active = new Set([c.id]); syncChips(); syncNav(); render(); } });
    });
    /* the assets and the countries, so a field or a plant can be found by its own
       name from anywhere in the report */
    if (t.length >= 2) {
      ASSETS.filter(a => hit(a.name) || hit(a.country) || hit(a.note || '')).slice(0, 12).forEach(a =>
        out.push({
          sec: 'Assets', icon: LOGOS[a.co](18), label: a.name,
          sub: (CFLAG[a.country] || '') + ' ' + a.country,
          run: () => {
            STATE.page = 'map'; MAP_LAYER = 'assets'; MAP_FOCUS = null; MAP_Q = a.name;
            if (!STATE.active.has(a.co)) { STATE.active.add(a.co); syncChips(); }
            syncNav(); render();
          }
        }));
      CORRIDORS.filter(c => hit(c.name)).forEach(c =>
        out.push({
          sec: 'Assets', icon: LOGOS[c.co](18), label: c.name, sub: 'pipeline or corridor',
          run: () => { STATE.page = 'map'; MAP_LAYER = 'assets'; MAP_Q = c.name; syncNav(); render(); }
        }));
      Object.keys(GEO).filter(hit).slice(0, 10).forEach(country =>
        out.push({
          sec: 'Countries', label: (CFLAG[country] || '') + ' ' + country, sub: 'pin on the map',
          run: () => { STATE.page = 'map'; MAP_LAYER = 'countries'; MAP_FOCUS = country; MAP_Q = ''; syncNav(); render(); }
        }));
    }
    [['All six companies', () => { STATE.active = new Set(COMPANIES.map(c => c.id)); syncChips(); render(); }],
    ['Maximum period, 1949 to 2025', () => { STATE.from = 1949; STATE.to = LATEST; syncRange(); render(); }],
    ['Last ten years', () => { STATE.from = LATEST - 10; STATE.to = LATEST; syncRange(); render(); }],
    ['Print or save as PDF', () => setTimeout(() => print(), 120)],
    ['Copy a link to this view', () => { writeHash(); navigator.clipboard && navigator.clipboard.writeText(location.href); }]]
      .filter(([l]) => hit(l)).forEach(([label, run]) => out.push({ sec: 'Actions', label, run }));
    return out.slice(0, 40);
  };
  const paint = () => {
    let html = '', last = null;
    items.forEach((it, i) => {
      if (it.sec !== last) { html += `<div class="cmd-sec">${it.sec}</div>`; last = it.sec; }
      html += `<div class="cmd-item${i === sel ? ' sel' : ''}" data-i="${i}">${it.icon || ''}<span>${it.label}</span>${it.sub ? `<span class="ci-sub">${it.sub}</span>` : ''}</div>`;
    });
    node.querySelector('.cmd-list').innerHTML = html || '<div class="cmd-sec">No match</div>';
    const s = node.querySelector('.cmd-item.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  };
  const open = () => {
    node.classList.add('on');
    const inp = node.querySelector('input'); inp.value = ''; inp.focus();
    items = build(''); sel = 0; paint();
  };
  const close = () => node.classList.remove('on');
  const run = i => { const it = items[i]; close(); if (it) it.run(); };
  return {
    init() {
      document.head.insertAdjacentHTML('beforeend', `<style>${CMD_STYLE}</style>`);
      document.body.insertAdjacentHTML('beforeend',
        `<div id="cmd"><div class="cmd-box"><input placeholder="Search pages, companies, countries and assets…" aria-label="Command palette">
          <div class="cmd-list"></div>
          <div class="cmd-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div></div>`);
      node = document.getElementById('cmd');
      node.addEventListener('click', e => {
        const it = e.target.closest('.cmd-item');
        if (it) run(+it.dataset.i); else if (!e.target.closest('.cmd-box')) close();
      });
      node.querySelector('input').addEventListener('input', e => { items = build(e.target.value); sel = 0; paint(); });
      addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); node.classList.contains('on') ? close() : open(); return; }
        if (!node.classList.contains('on')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); paint(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); paint(); }
        else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
      });
    },
    open
  };
})();

function syncNav() {
  document.querySelectorAll('.nav-item').forEach(n =>
    n.dataset.page === STATE.page ? n.setAttribute('aria-current', 'page') : n.removeAttribute('aria-current'));
}
function syncRange() {
  const f = document.getElementById('from'), t = document.getElementById('to');
  if (f) f.value = STATE.from; if (t) t.value = STATE.to;
  syncPresets();
}

/* wrap render so every view writes its own shareable address */
const _render = render;
render = function () { _render(); writeHash(); };

readHash();
CMD.init();
document.querySelector('.topbar .spacer').insertAdjacentHTML('afterend',
  `<button class="cmd-hint" id="cmdBtn" title="Search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search <kbd style="margin-left:2px">⌘K</kbd></button>`);
document.getElementById('cmdBtn').onclick = () => CMD.open();
syncNav(); syncChips(); syncRange(); render();


/* ------------------------------------------------- theme, drawer, a11y */
document.getElementById('themeBtn').onclick = () => applyTheme(THEME === 'dark' ? 'light' : 'dark');
/* follow the operating system on first open, unless the link says otherwise */
if (!/[?#&]t=/.test(location.hash) && window.matchMedia &&
  window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark', false);
applyTheme(THEME, false);

const navToggle = document.getElementById('navToggle');
const setNav = on => {
  document.body.classList.toggle('nav-open', on);
  navToggle.setAttribute('aria-expanded', on);
  navToggle.setAttribute('aria-label', on ? 'Hide the navigation' : 'Show the navigation');
};
navToggle.onclick = () => setNav(!document.body.classList.contains('nav-open'));
document.getElementById('nav').addEventListener('click', () => setNav(false));
document.addEventListener('click', e => {
  if (document.body.classList.contains('nav-open') &&
    !e.target.closest('.sidebar') && !e.target.closest('#navToggle')) setNav(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });
</script>
</body>
