<script>/* ============================================================ COMPANY MARKS
   Each company's emblem, drawn from its own brand geometry and colours:
   Aramco's four-lobed energy glyph, the Shell pecten, the bp Helios sunburst,
   the Chevron hallmark, the TotalEnergies flame and the ExxonMobil
   interlocking double-X. Identity aids within this report — they are not
   reproductions of the registered trademarks.
   ========================================================================= */

/* Shell pecten: hinge and ears at the top, the scalloped edge at the bottom,
   ribs fanning down from the hinge — built once and reused at both scales. */
const _pecten = (() => {
  /* seven scallop cusps along the bottom edge, deepest in the middle */
  const cusps = [[56.5, 38], [48.5, 42], [40, 44.5], [32, 45], [24, 44.5], [15.5, 42], [7.5, 38]];
  let d = 'M32 9 L47.5 13.5 C54 19 58 28 56.5 38 ';
  for (let i = 1; i < cusps.length; i++) {
    const [x0, y0] = cusps[i - 1], [x1, y1] = cusps[i];
    d += `Q${(x0 + x1) / 2} ${(y0 + y1) / 2 + 8} ${x1} ${y1} `;
  }
  d += 'C6 28 10 19 16.5 13.5 L32 9 Z';
  const ribs = cusps.map(([x, y]) =>
    `<path d="M32 14 L${32 + (x - 32) * .84} ${14 + (y - 14) * .86}"/>`).join('');
  return { d, ribs };
})();

let _gid = 0;                       /* every instance gets its own gradient ids */
const DRAWN = {

  /* Aramco — the four-point star with concave sides, in the corporate green
     gradient, on the deep green tile used across its own reports. */
  aramco: (s = 26, u = ++_gid) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><defs>
      <linearGradient id="arg${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8FD14F"/><stop offset="48%" stop-color="#00A94F"/><stop offset="100%" stop-color="#007A6B"/></linearGradient></defs>
    <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="rgba(11,11,11,.14)"/>
    <path d="M32 5 C34.6 17.4 46.6 29.4 59 32 C46.6 34.6 34.6 46.6 32 59 C29.4 46.6 17.4 34.6 5 32 C17.4 29.4 29.4 17.4 32 5Z"
          fill="url(#arg${u})"/>
  </svg>`,

  /* Shell — the pecten: hinge and ears at the top, scalloped edge below,
     red border, yellow field, red ribs fanning from the hinge. */
  shell: (s = 26) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#FBCE07"/>
    <g transform="translate(32 35) scale(1.1) translate(-32 -30)">
      <path d="${_pecten.d}" fill="#DD1D21"/>
      <g transform="translate(32 26) scale(.8) translate(-32 -26)">
        <path d="${_pecten.d}" fill="#FBCE07"/>
        <g stroke="#DD1D21" stroke-width="2.6" stroke-linecap="round" fill="none">${_pecten.ribs}</g>
      </g>
    </g></svg>`,

  /* bp — the Helios sunburst: 18 tapered rays running green at the rim to
     yellow at the core, on white. */
  bp: (s = 26, u = ++_gid) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><defs>
      <radialGradient id="bph${u}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF200"/><stop offset="42%" stop-color="#D7E01A"/>
        <stop offset="72%" stop-color="#8CC63F"/><stop offset="100%" stop-color="#57A733"/></radialGradient>
      <radialGradient id="bpi${u}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFDE0"/><stop offset="60%" stop-color="#FFF200"/>
        <stop offset="100%" stop-color="#E4E600"/></radialGradient></defs>
    <rect width="64" height="64" rx="14" fill="#046A38"/>
    <g transform="translate(32 32)">
      ${Array.from({ length: 18 }, (_, i) =>
    `<path d="M0 -28 C3.0 -18.5 4.2 -13.4 4.2 -8.6 C4.2 -3.7 2.2 0 0 0 C-2.2 0 -4.2 -3.7 -4.2 -8.6 C-4.2 -13.4 -3.0 -18.5 0 -28Z" fill="url(#bph${u})" transform="rotate(${i * 20})"/>`).join('')}
      ${Array.from({ length: 18 }, (_, i) =>
      `<path d="M0 -17.5 C2.1 -11.2 2.9 -8.0 2.9 -5.1 C2.9 -2.0 1.6 0 0 0 C-1.6 0 -2.9 -2.0 -2.9 -5.1 C-2.9 -8.0 -2.1 -11.2 0 -17.5Z" fill="url(#bpi${u})" transform="rotate(${i * 20 + 10})"/>`).join('')}
      <circle r="5.8" fill="#FFF200"/><circle r="2.6" fill="#8CC63F"/>
    </g></svg>`,

  chevron: (s = 26) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="rgba(11,11,11,.14)"/>
    <path d="M6 14 H21.5 L32 27.5 L42.5 14 H58 L32 47 Z" fill="#0054A4"/>
    <path d="M14 33 H26 L32 40.6 L38 33 H50 L32 55 Z" fill="#E21836"/>
    <path d="M6 14 H21.5 L32 27.5 L42.5 14 H58 L32 47 Z" fill="#FFFFFF" transform="translate(0 15.5)" opacity="0"/>
  </svg>`,

  /* TotalEnergies — the multicoloured flame: curved crescents spiralling out
     of a common origin, blue and green at the base rising to red at the tip. */
  totalenergies: (s = 26) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="rgba(11,11,11,.14)"/>
    <g transform="translate(30 44)">
      <path d="M0 0 C-13 -2 -21 -8 -24 -15 C-16 -12 -8 -9 0 0Z" fill="#0075C9"/>
      <path d="M0 0 C-12 -9 -16 -18 -15 -26 C-9 -19 -4 -10 0 0Z" fill="#00A03E"/>
      <path d="M0 0 C-6 -13 -5 -23 0 -31 C4 -22 4 -12 0 0Z" fill="#FFD100"/>
      <path d="M0 0 C2 -14 7 -23 14 -29 C13 -19 8 -9 0 0Z" fill="#FF7900"/>
      <path d="M0 0 C7 -11 15 -17 24 -18 C19 -10 11 -3 0 0Z" fill="#ED0000"/>
    </g></svg>`,

  /* ExxonMobil — the interlocking double-X of the Exxon wordmark, cut with a
     white channel where the strokes cross, over the Mobil blue rule. */
  exxonmobil: (s = 26) => `<svg class="logo-mark" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="rgba(11,11,11,.14)"/>
    <g stroke="#D6001C" stroke-width="7" stroke-linecap="butt" fill="none">
      <path d="M7 16 29 40"/><path d="M29 16 7 40"/>
      <path d="M35 16 57 40"/><path d="M57 16 35 40"/>
    </g>
    <rect x="7" y="46" width="50" height="5" rx="2.5" fill="#0C2340"/>
  </svg>`
};

/* Wordmark lock-ups — used wherever there is room for the full brand, so the
   company is named in its own colours as well as marked by its symbol. */
const WORDMARK = {
  aramco: { text: 'aramco', color: '#00843D', weight: 700, spacing: '-.02em', lower: 1 },
  shell: { text: 'Shell', color: '#DD1D21', weight: 700, spacing: '-.01em' },
  bp: { text: 'bp', color: '#046A38', weight: 700, spacing: '-.03em', lower: 1 },
  chevron: { text: 'Chevron', color: '#0054A4', weight: 650, spacing: '-.01em' },
  totalenergies: { text: 'TotalEnergies', color: '#ED0000', weight: 650, spacing: '-.015em' },
  exxonmobil: { text: 'ExxonMobil', color: '#D6001C', weight: 650, spacing: '-.015em' }
};
function logoLockup(id, size = 44) {
  const w = WORDMARK[id] || {};
  return `<span class="lockup">${LOGOS[id](size)}<span class="lw" style="color:${w.color};font-weight:${w.weight};letter-spacing:${w.spacing};` +
    `font-size:${Math.round(size * 0.42)}px${w.lower ? ';text-transform:lowercase' : ''}">${w.text || ''}</span></span>`;
}


/* ---------------------------------------------------------------------------
   Official marks are loaded from each company's own domain when the document
   is opened online; the drawn emblem above is the offline fallback, so the
   report never shows an empty box.
   --------------------------------------------------------------------------- */
const LOGO_DOMAIN = {
  aramco: 'aramco.com', exxonmobil: 'exxonmobil.com', shell: 'shell.com',
  bp: 'bp.com', chevron: 'chevron.com', totalenergies: 'totalenergies.com'
};
const LOGO_SOURCES = d => [
  `https://www.google.com/s2/favicons?sz=256&domain=${d}`,
  `https://logo.clearbit.com/${d}?size=256`,
  `https://icons.duckduckgo.com/ip3/${d}.ico`,
  `https://${d}/apple-touch-icon.png`,
  `https://${d}/favicon.ico`
];
function LOGOOK(img) {
  /* reject 1-pixel placeholders and blank responses; otherwise reveal */
  if (img.naturalWidth >= 32) img.style.opacity = 1; else LOGOFAIL(img);
}
function LOGOFAIL(img) {
  const rest = (img.dataset.next || '').split('|').filter(Boolean);
  if (rest.length) { img.dataset.next = rest.slice(1).join('|'); img.src = rest[0]; }
  else img.remove();                       // drawn emblem underneath takes over
}
const LOGOS = new Proxy({}, {
  get: (_, id) => (s = 26) => {
    /* official artwork supplied by the user — embedded, no network, always exact */
    if (typeof EMBED !== 'undefined' && EMBED[id] && EMBED[id].icon)
      return `<span class="logo-mark lm embed" style="width:${s}px;height:${s}px" title="${id}">` +
        `<img class="lm-real" src="${EMBED[id].icon}" alt=""></span>`;
    /* everything else: the vector mark, rasterised once and embedded as an image,
       so no badge can ever depend on gradient ids resolving at render time */
    if (typeof EMBED_MARK !== 'undefined' && EMBED_MARK[id])
      return `<span class="logo-mark lm embed tile" style="width:${s}px;height:${s}px" title="${id}">` +
        `<img class="lm-real" src="${EMBED_MARK[id]}" alt=""></span>`;
    const d = LOGO_DOMAIN[id];
    const srcs = d ? LOGO_SOURCES(d) : [];
    const img = srcs.length
      ? `<img class="lm-img" src="${srcs[0]}" data-next="${srcs.slice(1).join('|')}" alt="" referrerpolicy="no-referrer" onerror="LOGOFAIL(this)" onload="LOGOOK(this)">`
      : '';
    return `<span class="logo-mark lm" style="width:${s}px;height:${s}px" title="${id}">` +
      `<span class="lm-fb">${DRAWN[id] ? DRAWN[id](s) : ''}</span>${img}</span>`;
  }
});

/* Wide lock-up: the full official wordmark wherever the layout gives it room. */
function logoWord(id, h = 26) {
  if (typeof EMBED !== 'undefined' && EMBED[id] && EMBED[id].word)
    return `<img class="lm-word" src="${EMBED[id].word}" alt="" style="height:${h}px;width:${Math.round(h * EMBED[id].ar)}px">`;
  const w = (typeof WORDMARK !== 'undefined' && WORDMARK[id]) || {};
  return `<span class="lockup">${LOGOS[id](h)}<span class="lw" style="color:${w.color};font-weight:${w.weight};` +
    `letter-spacing:${w.spacing};font-size:${Math.round(h * .52)}px${w.lower ? ';text-transform:lowercase' : ''}">${w.text || ''}</span></span>`;
}
</script>
<script>/* ============================================================ HEAD TO HEAD
   Two companies, every comparable metric side by side, with the stronger
   side marked. Direction matters: on emissions and injuries, lower wins.
   ========================================================================= */
let H2H = { a: 'exxonmobil', b: 'aramco' };

const H2H_METRICS = [
  { g: 'Scale', k: 'prod', label: 'Production 2025', unit: 'kboe/d', d: 0, get: c => prod(c.id, LATEST) },
  { g: 'Scale', k: 'res', label: 'Proved reserves', unit: 'bn boe', d: 1, get: c => (lastWith(FINANCIALS, c.id, 'res', LATEST) || {}).res },
  { g: 'Scale', k: 'life', label: 'Reserve life', unit: 'years', d: 1, get: c => { const r = lastWith(FINANCIALS, c.id, 'res', LATEST), p = prod(c.id, LATEST); return r && p ? r.res * 1e9 / (p * 1000 * 365) : null; } },
  { g: 'Scale', k: 'ref', label: 'Refining', unit: 'kb/d', d: 0, get: c => c.refiningCapacity ?? (DOWNSTREAM[c.id] || {}).throughput },
  { g: 'Scale', k: 'emp', label: 'Employees', unit: 'people', d: 0, get: c => c.employees },
  { g: 'Money', k: 'rev', label: 'Revenue', unit: '$bn', d: 0, get: c => fin(c.id, LATEST).rev },
  { g: 'Money', k: 'ni', label: 'Net income', unit: '$bn', d: 1, get: c => fin(c.id, LATEST).ni },
  { g: 'Money', k: 'margin', label: 'Net margin', unit: '%', d: 1, get: c => { const f = fin(c.id, LATEST); return f.rev && f.ni != null ? f.ni / f.rev * 100 : null; } },
  { g: 'Money', k: 'capex', label: 'Capital expenditure', unit: '$bn', d: 1, get: c => fin(c.id, LATEST).capex },
  { g: 'Money', k: 'mcap', label: 'Market capitalisation', unit: '$bn', d: 0, get: c => fin(c.id, LATEST).mcap },
  { g: 'Money', k: 'roace', label: 'Return on capital', unit: '%', d: 1, get: c => ((PERF[c.id] || []).find(r => r.y === LATEST) || {}).roace },
  { g: 'Money', k: 'fcf', label: 'Free cash flow', unit: '$bn', d: 1, get: c => ((PERF[c.id] || []).find(r => r.y === LATEST) || {}).fcf },
  { g: 'Shareholder', k: 'ret', label: 'Returned to shareholders', unit: '$bn', d: 1, get: c => { const r = (RETURNS[c.id] || []).find(x => x.y === LATEST); return r ? (r.div || 0) + (r.bb || 0) : null; } },
  { g: 'Shareholder', k: 'yld', label: 'Dividend yield', unit: '%', d: 2, get: c => ((RETURNS[c.id] || []).find(x => x.y === LATEST) || {}).yld },
  { g: 'Shareholder', k: 'pe', label: 'Price / earnings', unit: '×', d: 1, lower: 1, get: c => (VALUATION[c.id] || {}).pe },
  { g: 'Shareholder', k: 'gear', label: 'Gearing', unit: '%', d: 1, lower: 1, get: c => (VALUATION[c.id] || {}).gearing },
  { g: 'Transition', k: 'ren', label: 'Renewable capacity', unit: 'GW', d: 1, get: c => (lastWith(LOWCARBON, c.id, 'cap', LATEST) || {}).cap },
  { g: 'Transition', k: 'lcpct', label: 'Low-carbon share of capex', unit: '%', d: 1, get: c => (lastWith(LOWCARBON, c.id, 'capexPct', LATEST) || {}).capexPct },
  { g: 'Transition', k: 'co2', label: 'Scope 1+2 emissions', unit: 'Mt CO₂e', d: 1, lower: 1, get: c => (latestS12(c) || {}).v },
  { g: 'Transition', k: 'co2pb', label: 'CO₂ per barrel produced', unit: 'kg/boe', d: 1, lower: 1, get: c => { const l = latestS12(c), p = prod(c.id, LATEST); return l && p ? l.v * 1e9 / (p * 1000 * 365) : null; } },
  { g: 'Transition', k: 'gas', label: 'Gas share of output', unit: '%', d: 0, get: c => { const r = rowFor(PRODUCTION, c.id, LATEST); return r && r.liq != null && r.boe ? (r.boe - r.liq) / r.boe * 100 : null; } },
  { g: 'Safety', k: 'trir', label: 'Recordable injury rate', unit: 'per 200k h', d: 3, lower: 1, get: c => { const rows = (SAFETY[c.id] || []).filter(r => r.trir != null); return rows.length ? rows[rows.length - 1].trir : null; } }
];

function pageHeadToHead() {
  const pool = sel().length >= 2 ? sel() : COMPANIES;
  if (!pool.find(c => c.id === H2H.a)) H2H.a = pool[0].id;
  if (!pool.find(c => c.id === H2H.b) || H2H.b === H2H.a) H2H.b = (pool.find(c => c.id !== H2H.a) || pool[0]).id;
  const A = BYID[H2H.a], B = BYID[H2H.b];

  const picker = (side, cur) => `<div class="h2h-pick">${COMPANIES.map(c =>
    `<button class="h2h-btn${c.id === cur ? ' on' : ''}" data-side="${side}" data-co="${c.id}" style="--cc:${c.color}" title="${c.name}">${LOGOS[c.id](28)}<span>${c.short}</span></button>`).join('')}</div>`;

  const groups = [...new Set(H2H_METRICS.map(m => m.g))];
  const rows = groups.map(g => {
    const items = H2H_METRICS.filter(m => m.g === g).map(m => {
      const va = m.get(A), vb = m.get(B);
      let win = 0;
      if (va != null && vb != null && va !== vb) win = (m.lower ? va < vb : va > vb) ? -1 : 1;
      const mx = Math.max(Math.abs(va || 0), Math.abs(vb || 0)) || 1;
      return `<tr>
        <td class="h2h-v ${win === -1 ? 'win' : ''}">${va == null ? '<span class="na">—</span>' : fmt(va, m.d)}</td>
        <td class="h2h-bar"><span class="hb a" style="width:${Math.abs(va || 0) / mx * 100}%;background:${A.color}"></span></td>
        <td class="h2h-lab">${m.label}<span class="h2h-u">${m.unit}${m.lower ? ' · lower is better' : ''}</span></td>
        <td class="h2h-bar r"><span class="hb b" style="width:${Math.abs(vb || 0) / mx * 100}%;background:${B.color}"></span></td>
        <td class="h2h-v ${win === 1 ? 'win' : ''}">${vb == null ? '<span class="na">—</span>' : fmt(vb, m.d)}</td>
      </tr>`;
    }).join('');
    return `<tr class="h2h-grp"><td colspan="5">${g}</td></tr>${items}`;
  }).join('');

  const scoreOf = side => H2H_METRICS.reduce((n, m) => {
    const va = m.get(A), vb = m.get(B);
    if (va == null || vb == null || va === vb) return n;
    const aWins = m.lower ? va < vb : va > vb;
    return n + ((side === 'a') === aWins ? 1 : 0);
  }, 0);

  document.getElementById('content').innerHTML = `
    <div class="h2h-head">
      <div class="h2h-side">${picker('a', H2H.a)}</div>
      <div class="h2h-vs">versus</div>
      <div class="h2h-side">${picker('b', H2H.b)}</div>
    </div>

    <div class="h2h-hero" style="--ca:${A.color};--cb:${B.color}">
      <div class="h2h-card" style="--c:${A.color}">${LOGOS[A.id](54)}
        <div><div class="pc-word" style="margin-bottom:3px">${logoWord(A.id, 30)}</div><div class="h2h-meta">${A.flag} ${A.hq} · founded ${A.founded} · ${A.ticker}</div></div>
        <div class="h2h-score">${scoreOf('a')}<span>metrics ahead</span></div></div>
      <div class="h2h-card" style="--c:${B.color}">${LOGOS[B.id](54)}
        <div><div class="pc-word" style="margin-bottom:3px">${logoWord(B.id, 30)}</div><div class="h2h-meta">${B.flag} ${B.hq} · founded ${B.founded} · ${B.ticker}</div></div>
        <div class="h2h-score">${scoreOf('b')}<span>metrics ahead</span></div></div>
    </div>

    <div class="grid" style="grid-template-columns:1fr;margin:13px 0">
      ${card('Metric by metric, ' + LATEST, { sub: 'The highlighted side is ahead on that measure. On emissions, gearing, price/earnings and injuries, lower is better and the highlight follows.', unit: 'head to head', body: `<table class="dt h2h">${rows}</table>`, bodyCls: 'tight' })}
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:13px">
      ${chartCard('h2-prod', 'Production', { sub: 'Thousand barrels of oil equivalent per day', unit: 'kboe/d' })}
      ${chartCard('h2-ni', 'Net income', { sub: 'Attributable to shareholders', unit: '$bn' })}
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${chartCard('h2-seg', 'Profit composition, 2025', { sub: 'Share of positive segment result', unit: '% of profit', foot: segLegend() })}
      ${card('The two histories', { sub: 'What each company was doing while the other was doing something else', body: `<div class="h2h-hist">
        <div><div class="sec-lab" style="color:${A.color}">${A.short}</div><div class="timeline" style="--pc:${A.color}">${(CHRONO[A.id] || []).slice(-6).map(m => `<div class="tl-item" style="--tc:${(TAGS[m.tag] || {}).color || A.color}"><div class="tl-year">${m.year} · ${m.title || ''}</div><div class="tl-text">${m.text}</div></div>`).join('')}</div></div>
        <div><div class="sec-lab" style="color:${B.color}">${B.short}</div><div class="timeline" style="--pc:${B.color}">${(CHRONO[B.id] || []).slice(-6).map(m => `<div class="tl-item" style="--tc:${(TAGS[m.tag] || {}).color || B.color}"><div class="tl-year">${m.year} · ${m.title || ''}</div><div class="tl-text">${m.text}</div></div>`).join('')}</div></div>
      </div>` })}
    </div>`;

  document.querySelectorAll('.h2h-btn').forEach(b => b.onclick = () => {
    const side = b.dataset.side, co = b.dataset.co;
    if (side === 'a' && co === H2H.b) H2H.b = H2H.a;
    if (side === 'b' && co === H2H.a) H2H.a = H2H.b;
    H2H[side] = co; pageHeadToHead();
  });

  const pair = (key, table) => [A, B].map(c => ({ id: c.id, name: c.short, color: c.color, points: (table[c.id] || []).filter(inRange).map(r => ({ x: r.y, y: r[key] ?? null, est: r.est })) })).filter(s => s.points.some(p => p.y != null));
  lineChart(document.getElementById('h2-prod'), { height: 260, yTitle: 'kboe/d', series: pair('boe', PRODUCTION), tipNote: '* proxy or predecessor basis' });
  lineChart(document.getElementById('h2-ni'), { height: 260, yTitle: '$bn', yFmt: v => fmt(v, 0), series: pair('ni', FINANCIALS) });
  stackedBarsH(document.getElementById('h2-seg'), {
    height: 150, unit: '%', keys: SEG_KEYS, showTotal: false, yFmt: v => fmt(v, 0),
    items: [A, B].map(c => {
      const s = SEGMENTS[c.id][LATEST] || {}, pos = Object.entries(s).filter(([, v]) => typeof v === 'number' && v > 0);
      const t = pos.reduce((a, [, v]) => a + v, 0) || 1;
      return { label: c.short, values: Object.fromEntries(pos.map(([k, v]) => [k, v / t * 100])), note: SEGMENTS[c.id].basis };
    })
  });
}
</script>
<script>/* ==========================================================================
   WORLD OUTLINE
   Coastlines at roughly 1° resolution: the continental rings and the larger
   islands, plus the enclosed seas that have to be painted back over the land.
   Simplified for legibility — this locates countries, it does not survey them.

  cp.appendChild(el('rect', { x: 0, y: 0, width: w, height: h, rx: 8 }));
  defs.appendChild(cp); svg.appendChild(defs);
  const root = el('g', { 'clip-path': `url(#${clipId})` });
  svg.appendChild(root);

  const og = el('linearGradient', { id: 'oc' + clipId, x1: '0', y1: '0', x2: '0', y2: '1' });
  og.appendChild(el('stop', { offset: '0%', 'stop-color': '#eaf4fb' }));
  og.appendChild(el('stop', { offset: '100%', 'stop-color': '#dbe9f5' }));
  defs.appendChild(og);
  root.appendChild(el('rect', { x: 0, y: 0, width: w, height: h, rx: 8, fill: `url(#oc${clipId})` }));
  /* graticule */
  const gstep = (lon1 - lon0) > 200 ? 30 : (lon1 - lon0) > 90 ? 20 : 10;
  for (let g = Math.ceil(lon0 / gstep) * gstep; g <= lon1; g += gstep)
    root.appendChild(el('line', { x1: P([g, lat1])[0], y1: 0, x2: P([g, lat0])[0], y2: h, stroke: '#d5e3ee', 'stroke-width': .8 }));
  for (let g = Math.ceil(lat0 / gstep) * gstep; g <= lat1; g += gstep)
    root.appendChild(el('line', { x1: 0, y1: P([lon0, g])[1], x2: w, y2: P([lon1, g])[1], stroke: '#d5e3ee', 'stroke-width': .8 }));
  /* equator, drawn a shade stronger */
  if (lat0 < 0 && lat1 > 0)
    root.appendChild(el('line', { x1: 0, y1: P([0, 0])[1], x2: w, y2: P([0, 0])[1], stroke: '#cfdce6', 'stroke-width': 1, 'stroke-dasharray': '4 4' }));

  const landG = el('g', { style: 'filter:drop-shadow(0 1px 1.5px rgba(23,43,64,.10))' });
  Object.values(LAND).forEach(poly =>
    landG.appendChild(el('path', { d: pathD(poly.map(P)) + ' Z', fill: '#d6dfe3', stroke: '#93a7b8', 'stroke-width': .9, 'stroke-linejoin': 'round' })));
  root.appendChild(landG);
  Object.values(SEAS).forEach(poly =>
    root.appendChild(el('path', { d: pathD(poly.map(P)) + ' Z', fill: '#e2eef8', stroke: '#93a7b8', 'stroke-width': .9, 'stroke-linejoin': 'round' })));

  /* ------------------------------------------------- one cluster per country */
  const byCountry = {};
  rows.forEach(({ co, country, sectors }) => {
    if (!GEO[country]) return;
    (byCountry[country] ||= []).push({ co, sectors });
  });
  const entries = Object.entries(byCountry).sort((a, b) => a[1].length - b[1].length);
  const lbl = [];
  /* corridors are drawn before the markers, so their labels join the same list */
  entries.forEach(([country, list]) => {
    const pos = P(GEO[country]);
    if (!inFrame(pos)) return;
    const [cx, cy] = pos;
    const n = list.length;
    const dotR = view === 'world' ? 4.8 : 6.2;
    const R = n === 1 ? 0 : (dotR + 2.4) / Math.sin(Math.PI / n) * 0.62 + n * 0.5;
    const g = el('g', { class: 'ctry-node', style: 'cursor:pointer' });
    g.appendChild(el('circle', {
      cx, cy, r: R + dotR + 3.5, fill: MAP_FOCUS === country ? 'var(--accent)' : '#0d1117',
      opacity: MAP_FOCUS === country ? .17 : .06
    }));
    if (MAP_FOCUS === country)
      g.appendChild(el('circle', { cx, cy, r: R + dotR + 5, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.6 }));
    list.forEach((it, i) => {
      const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
      g.appendChild(el('circle', {
        cx: cx + Math.cos(a) * R, cy: cy + Math.sin(a) * R, r: dotR,
        fill: it.co.color, stroke: '#fff', 'stroke-width': 1.4
      }));
    });
    const tip = `<div class="t-title">${CFLAG[country] || ''} ${country}<span style="float:right;font-weight:500;opacity:.7">${(REGION_KEYS.find(r => r[0] === CREGION[country]) || [])[1] || ''}</span></div>` +
      list.map(it => `<div class="t-row"><span class="t-key" style="background:${it.co.color}"></span><span class="t-name">${it.co.short}</span>` +
        `<span class="t-val">${it.sectors.map(s => (SECTORS.find(x => x[0] === s) || [])[1]).join(' · ')}</span></div>`).join('') +
      '<div class="t-note">Click to pin this country below the map</div>';
    g.addEventListener('mousemove', ev => TIP.show(tip, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    g.addEventListener('click', () => { if (MAP_MOVED) return; TIP.hide(); onPick && onPick(country); });
    root.appendChild(g);
    const floor = (lon1 - lon0) > 200 ? 3 : 1;   /* zoomed in, name everything */
    if (n >= floor || MAP_FOCUS === country) lbl.push([cx, cy + R + dotR + 12, country, n]);
  });

  /* --------------------------------------------------------- volume bubbles */
  (opts.volumes || []).forEach(b => {
    const g0 = GEO[b.country]; if (!g0) return;
    const pos = P(g0); if (!inFrame(pos)) return;
    const [cx, cy] = pos;
    const r = Math.max(4, Math.sqrt(b.v) * (view === 'world' ? 0.42 : 0.55));
    const g = el('g');
    g.appendChild(el('circle', { cx, cy, r, fill: b.co.color, opacity: .42, stroke: b.co.color, 'stroke-width': 1.4 }));
    g.appendChild(el('circle', { cx, cy, r: 2.2, fill: b.co.color }));
    const tip = `<div class="t-title">${CFLAG[b.country] || ''} ${b.country}</div>` +
      `<div class="t-row"><span class="t-key" style="background:${b.co.color}"></span><span class="t-name">${b.co.short}</span>` +
      `<span class="t-val">${fmt(b.v, 0)} kboe/d</span></div>` + (b.note ? `<div class="t-note">${b.note}</div>` : '');
    g.addEventListener('mousemove', ev => TIP.show(tip, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    root.appendChild(g);
    if (b.v > 300 || (lon1 - lon0) < 200) lbl.push([cx, cy + r + 11, `${b.country} · ${fmt(b.v, 0)}`, 1, b.co.color]);
  });

  /* ------------------------------------------------------ export corridors */
  (opts.corridors || []).forEach(c => {
    const co = BYID[c.co];
    const pts = c.path.map(P);
    if (!pts.some(inFrame)) return;
    const g = el('g');
    g.appendChild(el('path', { d: pathD(pts), fill: 'none', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .75 }));
    g.appendChild(el('path', {
      d: pathD(pts), fill: 'none', stroke: co.color, 'stroke-width': 2.4,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': '7 4'
    }));
    pts.forEach((q, i) => { if (i === 0 || i === pts.length - 1) g.appendChild(el('circle', { cx: q[0], cy: q[1], r: 3, fill: co.color, stroke: '#fff', 'stroke-width': 1.2 })); });
    const tip = `<div class="t-title">${c.name}</div><div class="t-row"><span class="t-key" style="background:${co.color}"></span>` +
      `<span class="t-name">${co.short}</span><span class="t-val">corridor</span></div><div class="t-note">${c.note}</div>`;
    g.addEventListener('mousemove', ev => TIP.show(tip, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    root.appendChild(g);
    const mid = pts[Math.floor(pts.length / 2)];
    if ((lon1 - lon0) < 200) lbl.push([mid[0], mid[1] - 9, c.name, 1, co.color]);
  });

  /* ------------------------------------------------- flagship asset markers */
  assets.forEach(a => {
    const pos = P(a.ll);
    if (!inFrame(pos)) return;
    const [x, y] = pos, r = view === 'world' ? 5 : 6.4;
    const co = BYID[a.co], sec = SECTORS.find(t => t[0] === a.sector) || [];
    const paint = colourBy === 'sector' ? (sec[2] || co.color) : co.color;
    const g = el('g', { style: 'cursor:default' });
    g.appendChild(el('path', {
      d: `M${x} ${y - r} L${x + r} ${y} L${x} ${y + r} L${x - r} ${y} Z`,
      fill: paint, stroke: '#fff', 'stroke-width': 1.5
    }));
    g.appendChild(el('circle', { cx: x, cy: y, r: r * .34, fill: '#fff', opacity: .9 }));
    const tip = `<div class="t-title">${a.name}<span style="float:right;font-weight:500;opacity:.7">${CFLAG[a.country] || ''} ${a.country}</span></div>` +
      `<div class="t-row"><span class="t-key" style="background:${co.color}"></span><span class="t-name">${co.short}</span>` +
      `<span class="t-val">${sec[1] || ''}</span></div>` +
      (a.note ? `<div class="t-note">${a.note}</div>` : '');
    g.addEventListener('mousemove', ev => TIP.show(tip, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    root.appendChild(g);
    if (view !== 'world' || MAP_BOX) lbl.push([x, y + r + 11, a.name, 1, paint]);
  });

  /* names, pushed apart so they never sit on top of one another */
  if (lbl.length) {
    const ys = declutter(lbl.map(p => p[1]), 11.5, 12, h - 6);
    lbl.forEach((p, i) => {
      /* keep names inside the panel: nudge and re-anchor near the edges */
      const near = 52;
      const anchor = p[0] < near ? 'start' : p[0] > w - near ? 'end' : 'middle';
      p[0] = Math.max(5, Math.min(w - 5, p[0]));
      const t = txt(p[2], {
        x: p[0], y: ys[i], class: 'dlabel', 'text-anchor': anchor,
        fill: p[4] || (MAP_FOCUS === p[2] ? 'var(--accent)' : 'var(--ink-1)'), 'font-size': view === 'world' ? 9.5 : 11,
        'font-weight': MAP_FOCUS === p[2] ? 700 : 600
      });
      if (Math.abs(ys[i] - p[1]) > 3)
        root.appendChild(el('line', { x1: p[0], y1: p[1] - 9, x2: p[0], y2: ys[i] - 7, stroke: '#9fb0bd', 'stroke-width': .8 }));
      root.appendChild(t);
    });
  }
  svg.appendChild(el('rect', { x: .5, y: .5, width: w - 1, height: h - 1, rx: 8, fill: 'none', stroke: 'var(--hair-strong)' }));

  /* ------------------------------------------------ wheel zoom, drag to pan */
  if (onBox) {
    MAP_ONBOX = onBox;
    svg.style.cursor = 'grab';
    svg.addEventListener('wheel', ev => {
      ev.preventDefault();
      const rc = svg.getBoundingClientRect();
      const px = (ev.clientX - rc.left) * (w / rc.width), py = (ev.clientY - rc.top) * (h / rc.height);
      const lon = lon0 + (px - ox) / k, lat = lat1 - (py - oy) / k;
      const f = ev.deltaY > 0 ? 1.2 : 1 / 1.2;
      const span = (lon1 - lon0) * f;
      if (span < 6 || span > 420) return;
      onBox([lon + (lon0 - lon) * f, lon + (lon1 - lon) * f,
      lat + (lat0 - lat) * f, lat + (lat1 - lat) * f]);
    }, { passive: false });
    svg.addEventListener('mousedown', ev => {
      const rc = svg.getBoundingClientRect();
      MAP_DRAG = { x: ev.clientX, y: ev.clientY, box: [lon0, lon1, lat0, lat1], k, sx: w / rc.width, sy: h / rc.height };
      MAP_MOVED = 0; svg.style.cursor = 'grabbing'; ev.preventDefault();
    });
    if (!worldMap._wired) {
      worldMap._wired = 1;
      let raf = 0, pend = null;
      window.addEventListener('mousemove', ev => {
        if (!MAP_DRAG) return;
        const d = MAP_DRAG;
        const dx = (ev.clientX - d.x) * d.sx / d.k, dy = (ev.clientY - d.y) * d.sy / d.k;
        if (Math.abs(ev.clientX - d.x) + Math.abs(ev.clientY - d.y) > 4) MAP_MOVED = 1;
        pend = [d.box[0] - dx, d.box[1] - dx, d.box[2] + dy, d.box[3] + dy];
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (pend && MAP_ONBOX) MAP_ONBOX(pend); });
      });
      window.addEventListener('mouseup', () => {
        MAP_DRAG = null;
        setTimeout(() => { MAP_MOVED = 0; }, 30);
        document.querySelectorAll('.chart-host svg').forEach(n => { if (n.style.cursor === 'grabbing') n.style.cursor = 'grab'; });
      });
    }
  }
}

/* -------------------------------------------------------------------- page */
function pageMap() {
  const list = sel();
  const rows = [];
  list.forEach(c => {
    const f = FOOTPRINT[c.id] || {};
    const seen = {};
    SECTORS.forEach(([k]) => (f[k] || []).forEach(country => {
      if (MAP_SECTOR !== 'all' && MAP_SECTOR !== k) return;
      (seen[country] ||= []).push(k);
    }));
    Object.entries(seen).forEach(([country, sectors]) => rows.push({ co: c, country, sectors }));
  });
  const counted = {};
  rows.forEach(r => (counted[r.country] ||= []).push(r));
  const countries = Object.keys(counted).sort((a, b) =>
    counted[b].length - counted[a].length || a.localeCompare(b));
  const perCo = list.map(c => ({ c, n: rows.filter(r => r.co.id === c.id).length })).sort((a, b) => b.n - a.n);
  const contested = countries.filter(c => counted[c].length >= 2).slice(0, 12);
  const solo = {};
  countries.filter(c => counted[c].length === 1).forEach(c => (solo[counted[c][0].co.id] ||= []).push(c));
  if (MAP_FOCUS && !counted[MAP_FOCUS]) MAP_FOCUS = null;

  /* positions by region, per company and per sector */
  const regionOf = c => CREGION[c] || 'asia_pacific';
  const byRegionCo = {}, byRegionSector = {};
  rows.forEach(r => {
    const rg = regionOf(r.country);
    (byRegionCo[r.co.id] ||= {})[rg] = (byRegionCo[r.co.id][rg] || 0) + 1;
    r.sectors.forEach(s => { (byRegionSector[rg] ||= {})[s] = (byRegionSector[rg][s] || 0) + 1; });
  });
  const regionsPresent = REGION_KEYS.filter(([k]) => byRegionSector[k]);

  /* flagship assets under the same company and sector filters */
  const assetRows = ASSETS.filter(a => STATE.active.has(a.co) &&
    (MAP_SECTOR === 'all' || a.sector === MAP_SECTOR))
    .sort((a, b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name));
  const corridorRows = CORRIDORS.filter(c => STATE.active.has(c.co));
  /* volumes: only what a company actually files at country level */
  const volRows = [];
  list.forEach(c => {
    const g = PRODGEO[c.id];
    if (!g || g.level !== 'country') return;
    g.rows.forEach(r => { if (GEO[r.country]) volRows.push({ co: c, country: r.country, v: r.v, note: r.note }); });

  const assetCount = {};
  assetRows.forEach(a => { assetCount[a.country] = (assetCount[a.country] || 0) + 1; });

  const widest = perCo[0], deepest = countries[0];
  const note = MAP_LAYER === 'volumes'
    ? `Only two of the six file production country by country. Chevron does, for ${fmt(3185, 0)} of its ${fmt(3723, 0)} kboe/d — the rest is one unallocated affiliates line. Aramco produces in one country. ExxonMobil files six geographic areas, TotalEnergies five regions, and Shell and bp file country tables whose exact location in their reports is named below — they are simply beyond what this file could read. The table below says exactly what each one publishes.`
    : MAP_LAYER === 'assets'
    ? `${assetRows.length} flagship assets on this selection, in ${new Set(assetRows.map(a => a.country)).size} countries — the individual fields, plants and terminals each company names in its own reporting. Hover any marker for what it is.`
    : widest && deepest
      ? `${widest.c.short} has disclosed positions in ${widest.n} countries on this selection — the widest of the group. ` +
      `${deepest} is the most crowded, with ${counted[deepest].length} of the six present` +

  const secChip = s => { const S = SECTORS.find(x => x[0] === s) || []; return `<span class="pill" style="background:${S[2]}14;color:${S[2]};border-color:${S[2]}33;margin-right:4px">${S[1]}</span>`; };

      counted[MAP_FOCUS].length + ' of the six present on this selection',
    unit: 'pinned country',
    body: `<table class="dt"><thead><tr><th style="text-align:left">Company</th><th style="text-align:left">What it holds there</th></tr></thead><tbody>${counted[MAP_FOCUS].map(r => `<tr>
        <td style="text-align:left"><span class="co-cell">${LOGOS[r.co.id](24)}<span class="dot" style="background:${r.co.color}"></span>${r.co.short}</span></td>
        <td style="text-align:left;white-space:normal">${r.sectors.map(secChip).join('')}</td></tr>`).join('')}</tbody></table>`,
    bodyCls: 'tight',
    foot: `<div class="legend"><button class="lnk" id="mp-clear">Clear pin</button></div>`
  }) : '';

  document.getElementById('content').innerHTML = `

      </div>
      ${MAP_LAYER === 'assets' ? `<span class="ctl-lab" style="margin-left:6px">Colour</span>
      <div class="seg">

      </div>` : ''}
      <button class="lnk" id="mp-reset" style="margin-left:6px">Reset zoom</button>
      <button class="lnk" id="mp-big" style="margin-left:6px">${MAP_BIG ? 'Shrink map' : 'Enlarge map'}</button>

    </div>

    <div class="grid" style="grid-template-columns:1fr;margin-bottom:13px">
      ${card(MAP_LAYER === 'assets' ? 'The assets themselves' : MAP_LAYER === 'volumes' ? 'How much comes from where' : 'Where the six operate', {

        ? 'Bubble area is 2025 production, drawn only where a company files volumes country by country. '

    </div>

        <td style="text-align:left;white-space:normal;color:var(--ink-2)">${g.basis} <a href="${g.url}" target="_blank" rel="noopener">${g.source}</a></td></tr>`; }).join('')}

  })}
    </div>

    <div class="grid" style="grid-template-columns:1fr;margin-bottom:13px">
      ${card('Flagship assets', {
    sub: 'The individual fields, plants and terminals behind the positions above — each one named in its owner\'s own reporting',
    unit: `<span data-findcount="assets">${assetRows.length} assets</span>`,
    body: `<div style="max-height:430px;overflow-y:auto"><table class="dt"><thead><tr>
        <th style="text-align:left">Asset</th><th style="text-align:left">Company</th><th style="text-align:left">Country</th>

      ${assetRows.map(a => `<tr data-find="${(a.name + ' ' + a.country + ' ' + BYID[a.co].short + ' ' + a.sector + ' ' + (a.note || '')).toLowerCase()}">
        <td style="text-align:left;font-weight:600">${a.name}</td>
        <td style="text-align:left"><span class="co-cell">${LOGOS[a.co](20)}${BYID[a.co].short}</span></td>
        <td style="text-align:left">${CFLAG[a.country] || ''} ${a.country}</td>
        <td style="text-align:left">${secChip(a.sector)}</td>
        <td style="text-align:left;white-space:normal;color:var(--ink-2)">${a.note || ''}</td></tr>`).join('')}
      </tbody></table></div>`, bodyCls: 'tight'
  })}
    </div>

    <div class="grid" style="grid-template-columns:1fr;margin-bottom:13px">
      ${card('Pipelines & export corridors', {
    sub: 'The lines that move the barrels and the molecules between the assets — shown on the map with the flagship-asset layer',
    unit: corridorRows.length + ' corridors',
    body: `<table class="dt"><thead><tr><th style="text-align:left">Corridor</th><th style="text-align:left">Operator or shareholder</th><th style="text-align:left">What it does</th></tr></thead><tbody>
      ${corridorRows.map(c => `<tr>
        <td style="text-align:left;font-weight:600">${c.name}</td>
        <td style="text-align:left"><span class="co-cell">${LOGOS[c.co](20)}${BYID[c.co].short}</span></td>
        <td style="text-align:left;white-space:normal;color:var(--ink-2)">${c.note}</td></tr>`).join('')}
      </tbody></table>`, bodyCls: 'tight'
  })}
    </div>

    <div class="grid" style="grid-template-columns:1fr 1.5fr">
      ${card('Where each stands alone', {
    sub: 'Countries in this selection where only that company is present',
    body: `<div class="solo">${list.map(c => `<div class="solo-row"><div class="solo-hd">${LOGOS[c.id](22)}<span>${c.short}</span><b>${(solo[c.id] || []).length}</b></div>
        <div class="solo-list">${(solo[c.id] || []).length ? (solo[c.id]).map(x => `<span class="pill" style="background:${c.color}14;color:${c.color};border-color:${c.color}33">${x}</span>`).join('') : '<span class="na">none — every position is shared</span>'}</div></div>`).join('')}</div>`,

  })}
      ${card('Country register', {

          <th style="text-align:left">Country</th><th style="text-align:left">Region</th><th style="text-align:left">Companies</th><th style="text-align:left">Assets</th><th style="text-align:left">Sectors</th></tr></thead><tbody>
        ${countries.map(country => {
      const here = counted[country];
      const secs = [...new Set(here.flatMap(h => h.sectors))];
      return `<tr class="reg-row${MAP_FOCUS === country ? ' on' : ''}" data-country="${country}" style="cursor:pointer">
            <td style="text-align:left;font-weight:600"><span style="margin-right:6px">${CFLAG[country] || ''}</span>${country}</td>
            <td style="text-align:left;color:var(--ink-3)">${(REGION_KEYS.find(r => r[0] === regionOf(country)) || [])[1] || ''}</td>
            <td style="text-align:left"><span style="display:inline-flex;gap:5px;align-items:center">${here.map(h => LOGOS[h.co.id](20)).join('')}</span></td>
            <td style="text-align:left;font-variant-numeric:tabular-nums;color:var(--ink-2)">${assetCount[country] || '<span class="na">—</span>'}</td>
            <td style="text-align:left;white-space:normal">${secs.map(secChip).join('')}</td></tr>`;
    }).join('')}
        </tbody></table></div>`, bodyCls: 'tight'
  })}
    </div>
    <p style="font-size:11px;color:var(--ink-3);margin-top:10px">Compiled from each company's annual report, Form 10-K or 20-F, and asset and country pages — principal disclosed positions rather than an exhaustive register of every legal entity. Coastlines are simplified outlines; the map locates countries, it does not draw borders.</p>`;

  const drawMap = () => worldMap(document.getElementById('mp-map'), {
    rows: MAP_LAYER === 'countries' ? rows : [],
    assets: MAP_LAYER === 'assets' ? assetRows : [],
    corridors: MAP_LAYER === 'assets' ? corridorRows : [],
    volumes: MAP_LAYER === 'volumes' ? volRows : [],
    height: mapH, view: MAP_VIEW, box: MAP_BOX || MAP_VIEWS[MAP_VIEW].box,
    colourBy: MAP_COLOUR,
    onPick: country => { MAP_FOCUS = MAP_FOCUS === country ? null : country; pageMap(); },
    onBox: nb => { MAP_BOX = nb; drawMap(); }
  });
  drawMap();
  barsH(document.getElementById('mp-count'), {
    height: 250, unit: '', yFmt: v => fmt(v, 0),
    items: perCo.map(o => ({ label: o.c.short, value: o.n, color: o.c.color, metric: 'Countries' }))
  });
  stackedBarsH(document.getElementById('mp-region'), {
    height: 250, unit: 'positions', keys: REGION_KEYS, yFmt: v => fmt(v, 0),
    items: perCo.map(o => ({ label: o.c.short, values: byRegionCo[o.c.id] || {} }))
  });
  stackedColumns(document.getElementById('mp-secreg'), {
    height: 285, unit: 'positions', keys: SECTORS, yTitle: 'positions', yFmt: v => fmt(v, 0),
    groups: regionsPresent.map(([k, l]) => ({ label: l.replace(' & ', ' &\n'), values: byRegionSector[k] || {} }))
  });
  barsH(document.getElementById('mp-contested'), {
    height: 285, unit: '', yFmt: v => fmt(v, 0),
    items: contested.map(c => ({
      label: c, value: counted[c].length, color: '#2f4b63', metric: 'Companies present',
      note: counted[c].map(r => r.co.short).join(', ')
    }))
  });

  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { MAP_SECTOR = b.dataset.sec; pageMap(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { MAP_VIEW = b.dataset.view; MAP_BOX = null; pageMap(); });
  document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => { MAP_LAYER = b.dataset.layer; pageMap(); });
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { MAP_COLOUR = b.dataset.col; pageMap(); });
  const rst = document.getElementById('mp-reset');
  if (rst) rst.onclick = () => { MAP_BOX = null; pageMap(); };
  const big = document.getElementById('mp-big');
  if (big) big.onclick = () => { MAP_BIG = MAP_BIG ? 0 : 1; pageMap(); };
  const dl = document.getElementById('mp-dl');
  if (dl) dl.onclick = () => {
    const svg = document.querySelector('#mp-map svg');
    if (!svg) return;
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    /* the SVG leaves the page, so resolve the two custom properties it uses */
    clone.querySelectorAll('[fill^="var("], [stroke^="var("]').forEach(n => {
      if ((n.getAttribute('fill') || '').startsWith('var(')) n.setAttribute('fill', '#0d1117');
      if ((n.getAttribute('stroke') || '').startsWith('var(')) n.setAttribute('stroke', '#d7dee5');
    });
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + clone.outerHTML], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'energy-majors-map-' + MAP_LAYER + '.svg';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  /* live filter over both registers, without redrawing the map */
  const q = document.getElementById('mp-q');
  const applyQ = () => {
    const v = (MAP_Q || '').trim().toLowerCase();
    document.querySelectorAll('tr[data-find]').forEach(r => {
      r.style.display = !v || r.dataset.find.includes(v) ? '' : 'none';
    });
    document.querySelectorAll('[data-findcount]').forEach(n => {
      const t = n.closest('.card').querySelectorAll('tr[data-find]');
      const shown = [...t].filter(r => r.style.display !== 'none').length;
      n.textContent = shown + ' ' + n.dataset.findcount;
    });
  };
  if (q) {
    q.oninput = () => { MAP_Q = q.value; applyQ(); };
    q.onkeydown = e => { if (e.key === 'Escape') { q.value = ''; MAP_Q = ''; applyQ(); } };
    applyQ();
  }
  document.querySelectorAll('.reg-row').forEach(r => r.onclick = () => {
    MAP_FOCUS = MAP_FOCUS === r.dataset.country ? null : r.dataset.country; pageMap();
  });
  const clr = document.getElementById('mp-clear');
  if (clr) clr.onclick = () => { MAP_FOCUS = null; pageMap(); };
}
</script>
<script>/* ==========================================================================
   THEME
   Dark mode is a selected palette, not an inverted one. The six series colours
   were re-stepped against the dark surface (#121a23) and validated with the
   dataviz validator: lightness band, chroma floor, adjacent CVD separation,
   normal-vision floor and contrast all pass —
     worst adjacent CVD  ΔE 11.7 (protan)   · target ≥ 8
     worst adjacent normal ΔE 15.9          · floor 15
     contrast             all six ≥ 3:1
   Aramco and TotalEnergies keep their exact brand colours; ExxonMobil's navy is
   lifted into the band because it is unreadable on a dark surface, and Shell's
   gold is stepped down for the same reason.
   ========================================================================== */
const DARK_SERIES = {
  aramco: '#00A0A8', exxonmobil: '#398AFE', shell: '#B98C0F',
  bp: '#067833', chevron: '#3366A9', totalenergies: '#E4002B'
};
let THEME = 'light';

function applyTheme(t, redraw = true) {
  THEME = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = THEME;
  COMPANIES.forEach(c => {
    c.colorLight ??= c.color;
    c.color = THEME === 'dark' ? (DARK_SERIES[c.id] || c.colorLight) : c.colorLight;
  });
  const b = document.getElementById('themeBtn');
  if (b) {
    b.setAttribute('aria-pressed', THEME === 'dark');
    b.setAttribute('aria-label', THEME === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme');
    b.innerHTML = THEME === 'dark'
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>Light'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>Dark';
  }
  if (redraw && typeof render === 'function') { render(); if (typeof writeHash === 'function') writeHash(); }
}

/* headers and charts get their labels after every render, so assistive
   technology reads a table as a table and a chart as a named image */
function a11yPass() {
  document.querySelectorAll('thead th:not([scope])').forEach(th => th.setAttribute('scope', 'col'));
  document.querySelectorAll('.card').forEach(card => {
    const h = card.querySelector('.card-hd h3'), host = card.querySelector('.chart-host');
    if (h && host && !host.getAttribute('aria-label')) {
      const unit = card.querySelector('.unit-chip');
      host.setAttribute('role', 'img');
      host.setAttribute('aria-label', h.textContent + (unit ? ', ' + unit.textContent : ''));
    }
  });
}
</script>
<script>/* ==========================================================================
   ENERGY MAJORS INTELLIGENCE — application v2
   ========================================================================== */

const BYID = Object.fromEntries(COMPANIES.map(c => [c.id, c]));
const LATEST = 2025;
const STATE = { page: 'overview', active: new Set(COMPANIES.map(c => c.id)), from: 1990, to: LATEST };

const sel = () => COMPANIES.filter(c => STATE.active.has(c.id));
const inRange = r => r.y >= STATE.from && r.y <= STATE.to;
const rowFor = (tbl, id, year) => (tbl[id] || []).find(r => r.y === year);
const lastWith = (tbl, id, key, upto = STATE.to) => {
  const rows = (tbl[id] || []).filter(r => r.y <= upto && r[key] != null);
  return rows.length ? rows[rows.length - 1] : null;
};
const prod = (id, y) => rowFor(PRODUCTION, id, y)?.boe ?? null;
const fin = (id, y) => rowFor(FINANCIALS, id, y) || {};
const pct = (a, b) => (a == null || b == null || !b) ? null : (a - b) / Math.abs(b) * 100;

/* ------------------------------------------------------------------- PAGES */
const IC = {
  overview: 'M3 12h4l3-8 4 16 3-8h4',
  benchmark: 'M4 5h16M4 12h16M4 19h16M8 3v4M14 10v4M11 17v4',
  h2h: 'M9 4v16M15 4v16M4 9h4M4 15h4M16 9h4M16 15h4',
  history: 'M12 8v4l3 2M3.05 11a9 9 0 1 1 .5 4M3 4v5h5',
  map: 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15',
  portfolio: 'M12 21a9 9 0 100-18 9 9 0 000 18zM3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 010 18 15 15 0 010-18z',
  segments: 'M12 12V3a9 9 0 109 9h-9zM14 3.5A9 9 0 0120.5 10H14z',
  downstream: 'M4 20h16M6 20V9l5-4 5 4v11M9 20v-5h4v5M14 12h3',
  safety: 'M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6l7-3zM9.5 12l1.8 1.8L15 10',
  production: 'M4 19V9l6-4 6 4v10M4 19h16M10 19v-5h4v5',
  power: 'M13 3L5 14h6l-1 7 8-11h-6l1-7z',
  financials: 'M4 20V10m5 10V4m5 16v-7m5 7V7',
  climate: 'M6 17a4 4 0 010-8 5.5 5.5 0 0110.5-1.5A3.75 3.75 0 0118 17H6z',
  profiles: 'M4 20v-1a5 5 0 015-5h1m8 6v-1a5 5 0 00-5-5h-1M12 3a3.5 3.5 0 110 7 3.5 3.5 0 010-7z',
  data: 'M4 6h16M4 12h16M4 18h16',
  sources: 'M6 4h9l3 3v13H6zM9 9h6M9 13h6M9 17h4'
};
const PAGES = [
  { g: 'Position', id: 'overview', label: 'Executive overview', sub: 'The six majors at a glance — 2025 standing and 25 years of context' },
  { g: 'Position', id: 'h2h', label: 'Head to head', sub: 'Two companies, every comparable metric side by side' },
  { g: 'Position', id: 'benchmark', label: 'Benchmark', sub: 'Every company against every metric, scored within each column' },
  { g: 'Operations', id: 'production', label: 'Production', sub: 'Hydrocarbon output, ranking, liquids and natural gas — back to 1949' },
  { g: 'Operations', id: 'map', label: 'World map', sub: 'Every country the six operate in, filtered by sector' },
  { g: 'Operations', id: 'portfolio', label: 'Portfolio & geography', sub: 'Where the barrels, the reserves and the refineries actually sit' },
  { g: 'Operations', id: 'downstream', label: 'Downstream, LNG & chemicals', sub: 'Refining, product sales, retail, petrochemicals and liquefied gas' },
  { g: 'Operations', id: 'power', label: 'Low-carbon & power', sub: 'Renewable capacity, electricity, EV charging and transition capital' },
  { g: 'Operations', id: 'history', label: 'History since 1870', sub: 'Every era and every milestone, from Standard Oil to 2025' },
  { g: 'Performance', id: 'financials', label: 'Financials & reserves', sub: 'Revenue, earnings, capital expenditure, proved reserves and refining' },
  { g: 'Performance', id: 'segments', label: 'Segments & returns', sub: 'Where the profit comes from and what goes back to shareholders' },
  { g: 'Performance', id: 'safety', label: 'Safety & workforce', sub: 'Injuries, process safety, spills, flaring, headcount and exploration' },
  { g: 'Performance', id: 'climate', label: 'Emissions & climate', sub: 'Scope 1, 2 and 3 emissions, carbon intensity and stated targets' },
  { g: 'Reference', id: 'profiles', label: 'Company profiles', sub: 'Identity, key facts and the full chronology' },
  { g: 'Reference', id: 'data', label: 'Data explorer', sub: 'Every figure in the model — sortable, filterable, exportable' },
  { g: 'Reference', id: 'sources', label: 'Sources & method', sub: 'Where each number comes from and how the series are built' }
];

/* ------------------------------------------------------------------ CHROME */
function buildChrome() {
  let html = '', lastG = null;
  PAGES.forEach(p => {
    if (p.g !== lastG) { html += `<div class="nav-group">${p.g}</div>`; lastG = p.g; }
    html += `<button class="nav-item" data-page="${p.id}"${p.id === STATE.page ? ' aria-current="page"' : ''}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[p.id]}"/></svg>
      <span>${p.label}</span></button>`;
  });
  document.getElementById('nav').innerHTML = html;
  document.getElementById('nav').onclick = e => {
    const b = e.target.closest('.nav-item'); if (!b) return;
    STATE.page = b.dataset.page;
    document.querySelectorAll('.nav-item').forEach(n => n.dataset.page === STATE.page ? n.setAttribute('aria-current', 'page') : n.removeAttribute('aria-current'));
    render();
  };

  document.getElementById('chips').innerHTML = COMPANIES.map(c => `
    <button class="chip" data-co="${c.id}" aria-pressed="true" style="--cc:${c.color}" title="Show or hide ${c.name}">
      ${LOGOS[c.id](19)}<span class="swatch" style="background:${c.color}"></span>${c.short}</button>`).join('');
  const toggle = id => {
    if (STATE.active.has(id)) { if (STATE.active.size === 1) return; STATE.active.delete(id); }
    else STATE.active.add(id);
    syncChips(); render();
  };
  document.getElementById('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) toggle(b.dataset.co); };
  document.getElementById('sideLegend').onclick = e => { const r = e.target.closest('.sl-row'); if (r) toggle(r.dataset.co); };

  const yrs = []; for (let y = 1949; y <= LATEST; y++) yrs.push(y);
  const opt = cur => yrs.map(y => `<option${y === cur ? ' selected' : ''}>${y}</option>`).join('');
  document.getElementById('from').innerHTML = opt(STATE.from);
  document.getElementById('to').innerHTML = opt(STATE.to);
  document.getElementById('from').onchange = e => { STATE.from = +e.target.value; if (STATE.to < STATE.from) { STATE.to = STATE.from; document.getElementById('to').value = STATE.to; } syncPresets(); render(); };
  document.getElementById('to').onchange = e => { STATE.to = +e.target.value; if (STATE.from > STATE.to) { STATE.from = STATE.to; document.getElementById('from').value = STATE.from; } syncPresets(); render(); };
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const [a, z] = b.dataset.preset.split('-').map(Number);
    STATE.from = a; STATE.to = z;
    document.getElementById('from').value = a; document.getElementById('to').value = z;
    syncPresets(); render();
  });
  syncPresets();
}
function syncChips() {
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', STATE.active.has(b.dataset.co)));
  drawSideLegend();
}
function syncPresets() {
  document.querySelectorAll('[data-preset]').forEach(b => {
    const [a, z] = b.dataset.preset.split('-').map(Number);
    b.setAttribute('aria-pressed', a === STATE.from && z === STATE.to);
  });
}
function drawSideLegend() {
  document.getElementById('sideLegend').innerHTML =
    `<div class="sl-title">2025 output · kboe/d</div>` +
    [...COMPANIES].sort((a, b) => (prod(b.id, LATEST) ?? 0) - (prod(a.id, LATEST) ?? 0)).map(c =>
      `<div class="sl-row${STATE.active.has(c.id) ? '' : ' off'}" data-co="${c.id}" role="button" title="Toggle ${c.name}">
        <span class="sl-key" style="background:${c.color}"></span>${c.short}
        <span class="sl-val">${fmt(prod(c.id, LATEST))}</span></div>`).join('');
}

/* ------------------------------------------------------------------ PIECES */
const card = (title, opts = {}) => {
  const { sub = '', unit = '', body = '', foot = '', bodyCls = '' } = opts;
  return `<div class="card"><div class="card-hd"><h3>${title}</h3>${unit ? `<span class="unit-chip">${unit}</span>` : ''}</div>` +
    `${sub ? `<p class="card-sub">${sub}</p>` : ''}<div class="card-bd ${bodyCls}">${body}</div>${foot}</div>`;
};
const chartCard = (id, title, opts = {}) => card(title, { ...opts, body: `<div class="chart-host chart" id="${id}"></div>` });
const legendFor = (list, line = false) => `<div class="legend">${list.map(c =>
  `<span class="lg-item">${LOGOS[c.id](17)}<span class="lg-key ${line ? 'line' : ''}" style="background:${c.color}"></span>${c.short}</span>`).join('')}</div>`;
const insight = txt => `<div class="insight"><span>${txt}</span></div>`;
const deltaHTML = (cur, prev, invert = false) => {
  const d = pct(cur, prev);
  if (d == null) return '<span class="delta flat">—</span>';
  const good = invert ? d < 0 : d > 0;
  const cls = Math.abs(d) < 0.3 ? 'flat' : good ? 'pos' : 'neg';
  return `<span class="delta ${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${Math.abs(d).toFixed(1)}%</span>`;
};

/* ================================================================ OVERVIEW */
function pageOverview() {
  const list = sel();
  const prod25 = list.map(c => ({ c, v: prod(c.id, LATEST) })).filter(o => o.v != null);
  const total = prod25.reduce((a, o) => a + o.v, 0);
  const sum = k => list.reduce((a, c) => a + (fin(c.id, LATEST)[k] || 0), 0);
  const emp = list.reduce((a, c) => a + (c.employees || 0), 0);
  const prevTotal = list.reduce((a, c) => a + (prod(c.id, LATEST - 1) || 0), 0);
  const sumRes = list.reduce((a, c) => a + ((lastWith(FINANCIALS, c.id, 'res', LATEST) || {}).res || 0), 0);
  /* combined output over the selected range, for the sparkline in the hero */

/* =============================================================== BENCHMARK */
const BENCH = [
  { key: 'prod', label: 'Production', unit: 'kboe/d', d: 0, get: c => prod(c.id, LATEST) },
  { key: 'gasShare', label: 'Gas share', unit: '%', d: 0, get: c => { const r = rowFor(PRODUCTION, c.id, LATEST); return r?.liq != null && r?.boe ? (r.boe - r.liq) / r.boe * 100 : null; } },
  { key: 'res', label: 'Reserves', unit: 'bn boe', d: 1, get: c => lastWith(FINANCIALS, c.id, 'res', LATEST)?.res ?? null },
  { key: 'life', label: 'Reserve life', unit: 'years', d: 1, get: c => { const r = lastWith(FINANCIALS, c.id, 'res', LATEST), p = prod(c.id, LATEST); return r && p ? r.res * 1e9 / (p * 1000 * 365) : null; } },
  { key: 'rev', label: 'Revenue', unit: '$bn', d: 0, get: c => fin(c.id, LATEST).rev },
  { key: 'ni', label: 'Net income', unit: '$bn', d: 1, get: c => fin(c.id, LATEST).ni },
  { key: 'margin', label: 'Net margin', unit: '%', d: 1, get: c => { const f = fin(c.id, LATEST); return f.rev && f.ni != null ? f.ni / f.rev * 100 : null; } },
  { key: 'capex', label: 'Capex', unit: '$bn', d: 1, get: c => fin(c.id, LATEST).capex },
  { key: 'mcap', label: 'Market cap', unit: '$bn', d: 0, get: c => fin(c.id, LATEST).mcap },
  { key: 'refining', label: 'Refining', unit: 'kb/d', d: 0, get: c => c.refiningCapacity },
  { key: 'renew', label: 'Renewables', unit: 'GW', d: 1, get: c => lastWith(LOWCARBON, c.id, 'cap', LATEST)?.cap ?? null },
  { key: 'co2', label: 'Scope 1+2', unit: 'Mt CO₂e', d: 0, invert: true, hint: 'Lower is better — colour is inverted', get: c => latestS12(c)?.v ?? null },
  { key: 'co2pb', label: 'CO₂ per boe', unit: 'kg', d: 1, invert: true, hint: 'Lower is better — colour is inverted', get: c => { const l = latestS12(c), p = prod(c.id, LATEST); return l && p ? l.v * 1e9 / (p * 1000 * 365) : null; } }
];
function latestS12(c) {
  for (let y = LATEST; y >= 2015; y--) {
    const r = rowFor(EMISSIONS, c.id, y); if (!r) continue;
    const v = r.s12 != null ? r.s12 : (r.s1 != null ? r.s1 + (r.s2 || 0) : null);
    if (v != null) return { y, v };
  }
  return null;
}
function pageBenchmark() {
  const list = sel();
  const rows = list.map(c => ({ id: c.id, name: c.short, color: c.color, values: Object.fromEntries(BENCH.map(m => [m.key, m.get(c)])) }));
  const score = c => {
    let s = 0, n = 0;
    BENCH.forEach(m => {
      const vals = list.map(m.get).filter(v => v != null); if (vals.length < 2) return;
      const v = m.get(c); if (v == null) return;
      const lo = Math.min(...vals), hi = Math.max(...vals);
      s += (m.invert ? (hi - v) : (v - lo)) / (hi - lo || 1); n++;
    });
    return n ? s / n * 100 : null;
  };
  const scored = list.map(c => ({ c, s: score(c) })).sort((a, b) => (b.s ?? 0) - (a.s ?? 0));

  document.getElementById('content').innerHTML = `
    ${insight('<b>How to read this.</b> Each column is scored on its own: the darkest cell is the highest value in that metric among the selected companies, the palest the lowest. The two emissions columns are inverted, so dark still means “better”. Colour never compares one column with another — a dark cell in Revenue and a dark cell in Reserves are unrelated.')}
    <div class="grid" style="grid-template-columns:1fr;margin:13px 0">
      ${card('Scorecard — ' + LATEST, { sub: 'Thirteen metrics, each normalised within its own column across the selected companies', unit: 'latest disclosure', body: '<div id="bm-heat"></div>', bodyCls: 'flush' })}
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
      ${chartCard('bm-comp', 'Composite standing', { sub: 'Unweighted mean of the thirteen normalised columns — a summary, not a verdict', unit: '0–100' })}
      ${chartCard('bm-margin', 'Net margin', { sub: 'Net income as a share of revenue, ' + LATEST, unit: '%' })}
      ${chartCard('bm-intensity', 'Carbon intensity of the barrel', { sub: 'Scope 1+2 divided by annual production — boundaries differ, see method', unit: 'kg CO₂e/boe' })}
    </div>`;

  heatTable(document.getElementById('bm-heat'), { rows, metrics: BENCH });

  barsH(document.getElementById('bm-comp'), {
    height: 230, yFmt: v => fmt(v, 0), unit: '',
    items: scored.map(o => ({ label: o.c.short, value: o.s, color: o.c.color, metric: 'Composite score', note: 'mean of normalised columns' }))
  });
  barsH(document.getElementById('bm-margin'), {
    height: 230, yFmt: v => fmt(v, 1), unit: '%',
    items: list.map(c => { const f = fin(c.id, LATEST); return { label: c.short, value: f.rev && f.ni != null ? f.ni / f.rev * 100 : null, color: c.color, metric: 'Net margin ' + LATEST }; })
      .sort((a, b) => (b.value ?? -99) - (a.value ?? -99))
  });
  barsH(document.getElementById('bm-intensity'), {
    height: 230, yFmt: v => fmt(v, 1), unit: 'kg/boe',
    items: list.map(c => {
      const l = latestS12(c), p = prod(c.id, LATEST);
      return { label: c.short, value: l && p ? l.v * 1e9 / (p * 1000 * 365) : null, color: c.color, metric: 'kg CO₂e per boe', note: l ? 'Scope 1+2 ' + l.y : 'not disclosed' };
    }).sort((a, b) => (a.value ?? 999) - (b.value ?? 999))
  });
}

let CHRONO_TAGS = new Set(Object.keys(TAGS));
function pageHistory() {
  const list = sel();
  const span = { from: 1865, to: LATEST };
  const events = list.flatMap(c => (CHRONO[c.id] || []).map(e => ({ ...e, co: c })))
    .filter(e => CHRONO_TAGS.has(e.tag))
    .sort((a, b) => a.year - b.year || a.co.name.localeCompare(b.co.name));

  document.getElementById('content').innerHTML = `
    ${insight('<b>One hundred and fifty-five years on one axis.</b> Standard Oil was incorporated in 1870 and three of the six companies on this page are its direct descendants — ExxonMobil and Chevron by law, and bp through the concessions the break-up left open. The bands are strategic eras; the dots below each band are dated milestones, coloured by what kind of event they were.')}

    <div class="grid" style="grid-template-columns:1fr;margin:13px 0">
      ${card('Eras and milestones, 1870–' + LATEST, { sub: 'Hover a band for the era, a dot for the event', unit: 'timeline', body: '<div class="chart-host chart" id="hi-gantt"></div>' })}
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700">Filter the chronology</span>
      ${Object.entries(TAGS).map(([k, t]) => `<button class="btn tagbtn${CHRONO_TAGS.has(k) ? ' on' : ''}" data-tag="${k}" style="${CHRONO_TAGS.has(k) ? `background:${t.color};border-color:${t.color};color:#fff` : ''}">${t.label}</button>`).join('')}
      <div style="flex:1"></div>
      <span style="font-size:11.5px;color:var(--ink-3)">${events.length} events</span>
    </div>

    <div class="grid" style="grid-template-columns:1fr">
      ${card('Chronology', { sub: 'Every dated milestone for the selected companies, oldest first', body: `<div class="chrono">${events.map(e => `
        <div class="ch-row">
          <div class="ch-year">${e.year}</div>
          <div class="ch-dot" style="background:${TAGS[e.tag].color}"></div>
          <div class="ch-body">
            <div class="ch-head">${LOGOS[e.co.id](24)}<b>${e.title}</b><span class="pill" style="background:${TAGS[e.tag].color}1a;color:${TAGS[e.tag].color};border-color:${TAGS[e.tag].color}33">${TAGS[e.tag].label}</span><span class="ch-co" style="color:${e.co.color}">${e.co.short}</span></div>
            <div class="ch-text">${e.text}</div>
          </div>
        </div>`).join('')}</div>`, bodyCls: 'tight' })}
    </div>`;

  eraGantt(document.getElementById('hi-gantt'), {
    from: span.from, to: span.to,
    rows: list.map(c => ({ id: c.id, name: c.short, color: c.color, founded: c.founded, eras: ERAS[c.id] || [], events: (CHRONO[c.id] || []).filter(e => CHRONO_TAGS.has(e.tag)) }))
  });

  document.querySelectorAll('.tagbtn').forEach(b => b.onclick = () => {
    const t = b.dataset.tag;
    if (CHRONO_TAGS.has(t)) { if (CHRONO_TAGS.size > 1) CHRONO_TAGS.delete(t); }
    else CHRONO_TAGS.add(t);
    pageHistory();
  });
}

const DATASETS = {
  production: { label: 'Production', table: PRODUCTION, cols: [['boe', 'Total', 'kboe/d', 0], ['liq', 'Liquids', 'kb/d', 0], ['gas', 'Natural gas', 'mmcf/d', 0]] },

  lowcarbon: { label: 'Low-carbon & power', table: LOWCARBON, cols: [['cap', 'Renewables', 'GW', 2], ['pipe', 'Pipeline', 'GW', 1], ['twh', 'Net power', 'TWh', 1], ['sales', 'Power sales', 'TWh', 1], ['capexLC', 'Low-carbon capex', '$bn', 2], ['capexPct', 'Share of capex', '%', 1], ['ev', 'EV points', '#', 0]] },
  returns: { label: 'Shareholder returns', table: RETURNS, cols: [['div', 'Dividends', '$bn', 2], ['bb', 'Buybacks', '$bn', 2], ['yld', 'Dividend yield', '%', 2]] },
  safety: { label: 'Safety', table: SAFETY, cols: [['trir', 'Recordable rate', 'per 200k h', 3], ['fat', 'Fatalities', 'people', 0], ['tier1', 'Tier 1 events', 'events', 0], ['spills', 'Spills', 'count', 0], ['flare', 'Flaring', 'as reported', 0]] },
  workforce: { label: 'Workforce', table: WORKFORCE, cols: [['n', 'Employees', 'people', 0]] },
  emissions: { label: 'Emissions', table: EMISSIONS, cols: [['s1', 'Scope 1', 'Mt', 1], ['s2', 'Scope 2', 'Mt', 1], ['s3', 'Scope 3 cat.11', 'Mt', 0], ['ui', 'Intensity', 'kg/boe', 1], ['mi', 'Methane', '%', 2], ['nci', 'Carbon intensity', 'gCO₂e/MJ', 1]] }
};
let DATASET = 'production', SORT = { key: 'y', dir: 'desc' };

function pageData() {
  const ds = DATASETS[DATASET], list = sel();
  let rows = [];
  list.forEach(c => (ds.table[c.id] || []).filter(inRange).forEach(r => rows.push({ c, r })));
  const val = o => SORT.key === 'y' ? o.r.y : SORT.key === 'co' ? o.c.short : o.r[SORT.key];
  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return SORT.dir === 'asc' ? c : -c;
  });
  const dirOf = k => SORT.key === k ? ` data-dir="${SORT.dir}"` : '';

  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap">
      <div class="seg">${Object.entries(DATASETS).map(([k, v]) => `<button data-ds="${k}" aria-pressed="${k === DATASET}">${v.label}</button>`).join('')}</div>
      <div style="flex:1"></div>
      <span style="font-size:11.5px;color:var(--ink-3)">${rows.length} rows · ${STATE.from}–${STATE.to} · click a header to sort</span>
      <button class="btn" id="dl">Download CSV</button>
    </div>
    <div class="table-wrap"><table class="dt">
      <thead><tr>
        <th class="sortable" data-k="co"${dirOf('co')}>Company<span class="sort-ind"></span></th>
        <th class="sortable" data-k="y"${dirOf('y')}>Year<span class="sort-ind"></span></th>
        ${ds.cols.map(c => `<th class="sortable" data-k="${c[0]}"${dirOf(c[0])}>${c[1]}<span class="sort-ind"></span><span class="th-unit">${c[2]}</span></th>`).join('')}
      </tr></thead>
      <tbody>${rows.map(({ c, r }) => `<tr>
        <td><span class="co-cell">${LOGOS[c.id](24)}<span class="dot" style="background:${c.color}"></span>${c.short}</span></td>
        <td>${r.y}</td>
        ${ds.cols.map(([k, , , d]) => `<td class="${r[k] == null ? 'na' : ''}">${r[k] == null ? '—' : fmt(r[k], d)}</td>`).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
    <p style="font-size:11px;color:var(--ink-3);margin-top:9px">An em dash means the company does not disclose that figure for that year — it is never a zero. Definitions and boundaries differ between companies; read Sources &amp; method before comparing.</p>`;

  document.querySelectorAll('[data-ds]').forEach(b => b.onclick = () => { DATASET = b.dataset.ds; SORT = { key: 'y', dir: 'desc' }; pageData(); });
  document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    SORT = { key: k, dir: SORT.key === k && SORT.dir === 'desc' ? 'asc' : 'desc' };
    pageData();
  });
  document.getElementById('dl').onclick = () => {
    const head = ['Company', 'Year', ...ds.cols.map(c => `${c[1]} (${c[2]})`)];
    const body = rows.map(({ c, r }) => [c.name, r.y, ...ds.cols.map(([k]) => r[k] ?? '')]);
    const csv = [head, ...body].map(r => r.map(v => typeof v === 'string' && v.includes(',') ? `"${v}"` : v).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `energy-majors-${DATASET}-${STATE.from}-${STATE.to}.csv`;
    a.click();
  };
}

      <td style="text-align:left"><span class="co-cell">${LOGOS[v.co](20)}${BYID[v.co].short}</span></td>
