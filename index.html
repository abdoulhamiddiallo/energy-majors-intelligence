<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Majors Intelligence — production, transition and climate</title>
<style>/* ==========================================================================
   ENERGY MAJORS INTELLIGENCE — design system v2
   Series palette validated with the dataviz validator on the light surface:
   all-pairs CVD ΔE 9.1 · normal-vision ΔE 17.7. Two documented deviations,
   both mitigated: Shell gold sits below 3:1 (relief = direct labels + table
   view), ExxonMobil navy sits below the lightness band (it is darker, so it
   gains contrast — 7.9:1 — rather than losing it).
   ========================================================================== */

:root {
  color-scheme: light;

  --surface-1: #fcfcfb;
  --page: #eef0f2;
  --panel: #ffffff;
  --panel-2: #f7f8f9;
  --ink-1: #0d1117;
  --ink-2: #4a5158;
  --ink-3: #6b7278;
  --grid: #eceef0;
  --axis: #d2d6da;
  --hair: #e4e7ea;
  --hair-strong: #ccd1d6;

  /* company series — fixed slots, bound to the entity, never to rank */
  --c-exxonmobil: #123A73;
  --c-chevron:    #1064BE;
  --c-shell:      #D9A400;
  --c-bp:         #007A33;
  --c-total:      #E4002B;
  --c-aramco:     #00A0A8;

  --seq-0: #eef4fd; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
  --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;

  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --up: #08663a; --down: #b3261e;

  /* the dark band, defined once and used by every hero */
  --band: linear-gradient(135deg, #14212f 0%, #0e1926 46%, #0b131c 100%);
  --band-glow: radial-gradient(78% 130% at 88% 0%, rgba(57,135,229,.16) 0%, rgba(57,135,229,0) 62%);
  --band-ink: #ffffff;
  --band-lab: #8ba0b3;
  --band-note: #c3cedb;
  --band-rule: rgba(255,255,255,.11);
  --band-track: rgba(255,255,255,.10);
  --accent: #1c5cab;
  --accent-on-dark: #7fb2f0;

  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --sh-1: 0 1px 2px rgba(13,17,23,.05);
  --sh-2: 0 1px 2px rgba(13,17,23,.05), 0 10px 24px -14px rgba(13,17,23,.22);
  --sh-3: 0 2px 6px rgba(13,17,23,.07), 0 20px 40px -20px rgba(13,17,23,.30);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --num: "SF Mono", "Cascadia Mono", "Roboto Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); background: var(--page); color: var(--ink-1);
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
a { color: #1c5cab; }
::selection { background: #cfe0f7; }

/* ---------------------------------------------------------------- shell -- */
#app { display: grid; grid-template-columns: 244px 1fr; height: 100vh; overflow: hidden; }

.sidebar {
  background: linear-gradient(180deg, #0b1017 0%, #0e141c 55%, #0b1219 100%);
  color: #e7eaee; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: inset -1px 0 0 rgba(255,255,255,.06);
}
.brand { padding: 18px 18px 15px; display: flex; gap: 11px; align-items: flex-start; }
.brand .b-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, #00A0A8 0%, #1064BE 50%, #123A73 100%);
  box-shadow: 0 3px 10px -3px rgba(0,160,168,.55);
}
.brand h1 { margin: 0; font-size: 13.5px; letter-spacing: -.005em; font-weight: 660; line-height: 1.3; }
.brand .sub { margin-top: 3px; font-size: 9.5px; color: #7d868f; letter-spacing: .11em; text-transform: uppercase; font-weight: 600; }

.nav { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.nav::-webkit-scrollbar { width: 0; }
/* a soft edge, so it is obvious the navigation continues below the fold */
.nav { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 26px), transparent 100%);
       mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 26px), transparent 100%); }
.nav-group { font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; color: #5d666f; font-weight: 700; padding: 14px 11px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: var(--r-sm);
  background: none; border: 0; cursor: pointer; text-align: left; color: #aab2ba; font-size: 12.5px;
  transition: background .13s ease, color .13s ease; position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.055); color: #fff; }
.nav-item[aria-current="page"] { background: rgba(255,255,255,.10); color: #fff; font-weight: 600; }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px;
  background: #00C2CC; border-radius: 0 3px 3px 0;
}
.nav-item svg { flex: none; opacity: .95; }

.side-legend { padding: 10px 14px 6px; border-top: 1px solid rgba(255,255,255,.07); flex: 0 0 auto; max-height: 34vh; overflow-y: auto; scrollbar-width: none; }
.side-legend::-webkit-scrollbar { width: 0; }
.side-legend .sl-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: .11em; color: #5d666f; font-weight: 700; margin-bottom: 7px; }
.sl-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11.5px; color: #99a1a9; }
.sl-row .sl-key { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.sl-row .sl-val { margin-left: auto; font-variant-numeric: tabular-nums; color: #e7eaee; font-weight: 600; font-size: 11px; }
.sl-row.off { opacity: .32; }
.sidebar-foot { padding: 10px 16px 14px; font-size: 9.5px; color: #5d666f; line-height: 1.6; border-top: 1px solid rgba(255,255,255,.07); }

/* ----------------------------------------------------------------- main -- */
.main { display: flex; flex-direction: column; overflow: hidden; background: var(--page); }

.topbar {
  display: flex; align-items: center; gap: 18px; padding: 11px 24px;
  background: var(--panel); border-bottom: 1px solid var(--hair); flex: none; min-height: 60px;
  box-shadow: var(--sh-1); z-index: 5;
}
.topbar h2 { margin: 0; font-size: 16.5px; font-weight: 660; letter-spacing: -.015em; }
.topbar .page-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.topbar .spacer { flex: 1; }

.chipbar { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.chipbar::-webkit-scrollbar { height: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 4px;
  border: 1px solid var(--hair-strong); border-radius: 999px; background: #fff; cursor: pointer;
  font-size: 11.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap;
  transition: border-color .13s, box-shadow .13s, opacity .13s, transform .13s;
}
.chip:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.chip[aria-pressed="true"] { color: var(--ink-1); box-shadow: inset 0 0 0 1px var(--cc); border-color: var(--cc); }
.chip .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chip[aria-pressed="false"] { opacity: .42; }
.chip[aria-pressed="false"] .logo-mark { filter: grayscale(1); }

.seg { display: inline-flex; border: 1px solid var(--hair-strong); border-radius: var(--r-sm); overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 12px; font-weight: 550; cursor: pointer; color: var(--ink-2); transition: background .12s; }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button:hover { background: var(--panel-2); }
.seg button[aria-pressed="true"] { background: var(--ink-1); color: #fff; }

.range { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); }
.range select {
  font: inherit; font-size: 12px; padding: 4px 7px; border-radius: var(--r-sm);
  border: 1px solid var(--hair-strong); background: #fff; color: var(--ink-1); font-variant-numeric: tabular-nums;
}

.content { flex: 1; overflow-y: auto; padding: 16px 24px 30px; scroll-behavior: smooth; }
.content::-webkit-scrollbar { width: 11px; }
.content::-webkit-scrollbar-thumb { background: #cdd2d7; border-radius: 8px; border: 3px solid var(--page); }
.content::-webkit-scrollbar-thumb:hover { background: #b6bcc2; }

/* ---------------------------------------------------------------- cards -- */
.grid { display: grid; gap: 13px; }
.card {
  background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-md);
  box-shadow: var(--sh-2); padding: 0; min-width: 0; display: flex; flex-direction: column;
  transition: box-shadow .18s ease;
}
.card:hover { box-shadow: var(--sh-3); }
.card-hd { padding: 13px 16px 0; display: flex; align-items: baseline; gap: 10px; }
.card-hd h3 { margin: 0; font-size: 13px; font-weight: 660; letter-spacing: -.008em; }
.card-hd .unit-chip {
  margin-left: auto; font-size: 9.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--panel-2); border: 1px solid var(--hair); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.card-sub { margin: 3px 16px 0; font-size: 11px; color: var(--ink-3); line-height: 1.45; }
.card-bd { padding: 8px 14px 12px; flex: 1; min-height: 0; }
.card-bd.tight { padding: 4px 10px 8px; }
.card-bd.flush { padding: 8px 0 0; }

/* ------------------------------------------------------------------ kpi -- */
.kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 11px; }
.kpi {
  background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-md);
  padding: 11px 13px 10px; box-shadow: var(--sh-2); position: relative; overflow: hidden;
  transition: box-shadow .18s, transform .18s;
}
.kpi:hover { box-shadow: var(--sh-3); transform: translateY(-1px); }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--kc, var(--ink-3)); }
.kpi .k-head { display: flex; align-items: center; gap: 7px; margin: 3px 0 7px; }
.kpi .k-name { font-size: 11.5px; font-weight: 620; color: var(--ink-2); letter-spacing: -.005em; }
.kpi .k-val { font-size: 24px; font-weight: 670; letter-spacing: -.028em; line-height: 1.02; font-variant-numeric: tabular-nums; }
.kpi .k-unit { font-size: 11px; color: var(--ink-3); font-weight: 550; margin-left: 3px; letter-spacing: 0; }
.kpi .k-meta { margin-top: 5px; font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.kpi .k-sub { margin-top: 3px; font-size: 10.5px; color: var(--ink-3); }
.delta { font-weight: 660; font-size: 11px; display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.delta.pos { color: var(--up); } .delta.neg { color: var(--down); } .delta.flat { color: var(--ink-3); }

/* ----------------------------------------------------------------- hero -- */
.hero {
  background: var(--band-glow), var(--band);
  color: var(--band-ink); border-radius: var(--r-md); padding: 17px 22px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px;
  border: 1px solid rgba(255,255,255,.06); box-shadow: var(--sh-2); position: relative; overflow: hidden;
}
/* a hairline of the six company colours, so the band belongs to this palette */
.hero::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; opacity: .72;
  background: linear-gradient(90deg,
    var(--c-aramco) 0 16.6%, var(--c-exxonmobil) 16.6% 33.3%, var(--c-shell) 33.3% 50%,
    var(--c-bp) 50% 66.6%, var(--c-chevron) 66.6% 83.3%, var(--c-total) 83.3% 100%);
}

.hero .h-fig { font-size: 40px; font-weight: 690; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .h-lab { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--band-lab); margin-bottom: 5px; font-weight: 650; }
.hero .h-note { font-size: 11.8px; color: var(--band-note); line-height: 1.6; }
.hero > .h-note { flex: 1 1 300px; min-width: 265px; }        /* direct child: a column of the row */
.hero .h-right > .h-note { flex: 0 1 auto; }                   /* nested: keep its natural height */
.hero > div:first-child { flex: 0 0 auto; min-width: 180px; }
.hero .h-left { display: flex; flex-direction: column; justify-content: center; gap: 9px; flex: 0 0 auto; min-width: 200px; }
.hero .h-spark { height: 34px; }
.hero .h-right { display: flex; flex-direction: column; justify-content: center; gap: 9px; flex: 1 1 300px; min-width: 265px; }
.hero .h-delta { font-size: 11.5px; color: var(--band-lab); display: flex; align-items: center; gap: 7px; }
.hero .h-div { flex: 0 0 1px; align-self: stretch; min-height: 74px; }
.hero .h-div { width: 1px; align-self: stretch; background: var(--band-rule); }
.hero .h-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(106px, 1fr)); gap: 13px 20px;
  align-content: center; flex: 1 1 380px; min-width: 300px; }
.hero .h-stats .h-fig { font-size: 21px; }
.hero .h-stats .h-lab { margin-bottom: 3px; }

/* --------------------------------------------------------------- legend -- */
.legend { display: flex; flex-wrap: wrap; gap: 3px 13px; padding: 6px 16px 10px; }
.lg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
.lg-item .lg-key { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.lg-item .lg-key.line { height: 3px; border-radius: 2px; width: 14px; }

/* --------------------------------------------------------------- tables -- */
table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { padding: 6px 9px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.dt th {
  font-weight: 640; color: var(--ink-2); font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
  position: sticky; top: 0; background: var(--panel); z-index: 2; border-bottom: 1px solid var(--hair-strong);
}
table.dt th .th-unit { display: block; font-weight: 500; color: var(--ink-3); text-transform: none; letter-spacing: 0; font-size: 9.5px; }
table.dt th:first-child, table.dt td:first-child { text-align: left; }
table.dt tbody tr:hover { background: #f5f7f9; }
table.dt td.na { color: var(--ink-3); }
table.dt th.sortable { cursor: pointer; user-select: none; }
table.dt th.sortable:hover { color: var(--ink-1); }
table.dt th.sortable .sort-ind::after { content: "↕"; opacity: .3; margin-left: 4px; }
table.dt th.sortable[data-dir="asc"] .sort-ind::after { content: "↑"; opacity: 1; }
table.dt th.sortable[data-dir="desc"] .sort-ind::after { content: "↓"; opacity: 1; }
.co-cell { display: inline-flex; align-items: center; gap: 7px; font-weight: 560; }
.co-cell .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.table-wrap { overflow: auto; max-height: calc(100vh - 236px); border: 1px solid var(--hair); border-radius: var(--r-md); background: var(--panel); box-shadow: var(--sh-2); }

table.heat td.heat-cell { background: var(--bg); color: var(--fg); font-weight: 600; text-align: center; border-bottom: 2px solid var(--panel); border-right: 2px solid var(--panel); }
table.heat tbody tr:hover { background: transparent; }
table.heat tbody tr:hover td.heat-cell { outline: 2px solid var(--ink-1); outline-offset: -2px; }
table.heat td:first-child, table.heat th:first-child { background: var(--panel); }

table.league td { padding: 8px 9px; }
table.league td.rank { color: var(--ink-3); font-weight: 700; text-align: center; }
table.league td.barcell { position: relative; text-align: left; }
table.league td.barcell .bar { display: inline-block; height: 15px; border-radius: 3px; vertical-align: middle; margin-right: 9px; max-width: calc(100% - 78px); }
table.league td.barcell b { font-weight: 650; }
table.league .sparkhost { display: inline-block; width: 88px; height: 26px; }

/* -------------------------------------------------------------- profile -- */
.profile-card { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-md); box-shadow: var(--sh-2); overflow: hidden; transition: box-shadow .18s; }
.profile-card:hover { box-shadow: var(--sh-3); }
.pc-head { padding: 15px 17px 13px; display: flex; align-items: center; gap: 13px; position: relative; background: linear-gradient(180deg, var(--pc-soft, #fafbfc) 0%, var(--panel) 100%); }
.pc-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--pc, #ccc); }
.pc-name { font-size: 16px; font-weight: 670; letter-spacing: -.02em; }
.pc-legal { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.pc-body { padding: 13px 17px 15px; }
.pc-desc { font-size: 12px; color: var(--ink-2); line-height: 1.6; margin: 0 0 13px; }
.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 9px 13px; }
.fact { border-left: 2px solid var(--hair); padding-left: 8px; }
.fact .f-lab { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; }
.fact .f-val { font-size: 13.5px; font-weight: 640; letter-spacing: -.015em; margin-top: 1px; font-variant-numeric: tabular-nums; }
.fact .f-val small { font-weight: 500; font-size: 10.5px; color: var(--ink-2); letter-spacing: 0; }

.sec-lab { font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 700; margin: 16px 0 8px; }
.timeline { position: relative; padding-left: 17px; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--grid); border-radius: 2px; }
.tl-item { position: relative; padding: 0 0 10px 0; }
.tl-item::before { content: ""; position: absolute; left: -17px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--pc, #999); border: 2px solid var(--panel); }
.tl-year { font-size: 11.5px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tl-text { font-size: 11.5px; color: var(--ink-2); line-height: 1.5; }

/* --------------------------------------------------------------- charts -- */
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--ink-3); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 650; }
.chart .dlabel { font-size: 10.5px; font-weight: 660; paint-order: stroke; stroke: var(--panel); stroke-width: 3.2px; stroke-linejoin: round; font-variant-numeric: tabular-nums; }
.chart .dlabel.plain { stroke: none; }
.chart .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .halo { stroke: var(--panel); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.chart .note { fill: var(--ink-3); font-size: 9.5px; font-weight: 600; }

#tip {
  position: fixed; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .09s;
  background: #0d1117; color: #f1f3f5; border-radius: 9px; padding: 9px 11px; font-size: 11.5px;
  box-shadow: 0 12px 36px -8px rgba(0,0,0,.55); max-width: 300px; line-height: 1.45;
  border: 1px solid rgba(255,255,255,.10);
}
#tip .t-title { font-weight: 660; font-size: 12px; margin-bottom: 5px; letter-spacing: -.01em; }
#tip .t-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 1px 0; }
#tip .t-row .t-key { width: 8px; height: 8px; border-radius: 2px; flex: none; }
#tip .t-row .t-name { flex: 1; color: #a8b2bb; }
#tip .t-row .t-val { font-weight: 640; }
#tip .t-note { margin-top: 5px; color: #8b949e; font-size: 10.5px; }

/* -------------------------------------------------------------- accents -- */
.pill { display: inline-block; font-size: 10px; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--hair); }
.pill.good { background: #e6f6ea; color: #08663a; border-color: #c6e8d1; }
.pill.warn { background: #fdf3dc; color: #8a6100; border-color: #f2e0b4; }
.pill.crit { background: #fceaea; color: #a12525; border-color: #f3cdcd; }

.callout { border-left: 3px solid var(--axis); padding: 7px 0 7px 11px; font-size: 11.5px; color: var(--ink-2); line-height: 1.55; }
.callout + .callout { margin-top: 9px; }
.callout b { color: var(--ink-1); }

.insight {
  display: flex; gap: 11px; align-items: flex-start; background: var(--panel); border: 1px solid var(--hair);
  border-left: 3px solid var(--ink-1); border-radius: var(--r-sm); padding: 10px 14px; font-size: 12px;
  color: var(--ink-2); line-height: 1.55; box-shadow: var(--sh-1);
}
.insight b { color: var(--ink-1); }

.btn {
  border: 1px solid var(--hair-strong); background: #fff; border-radius: var(--r-sm); padding: 5px 11px;
  font-size: 12px; font-weight: 570; cursor: pointer; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--panel-2); border-color: var(--ink-3); }

[[EARLY_PRODUCTION, PRODUCTION], [EARLY_FINANCIALS, FINANCIALS]].forEach(([early, table]) => {
  Object.entries(early).forEach(([id, rows]) => {
    const have = new Map((table[id] || []).map(r => [r.y, r]));
    rows.forEach(r => { if (!have.has(r.y)) have.set(r.y, r); else Object.assign(have.get(r.y), r, have.get(r.y)); });
    table[id] = [...have.values()].sort((a, b) => a.y - b.y);
  });
});

    { year: 1971, title: 'North Sea Brent discovered', text: 'Shell and Esso find the Brent field east of Shetland; first oil in 1976 makes the UK North Sea a core province and gives the world its benchmark crude marker.', tag: 'discovery' },
    { year: 1973, title: 'Oil shock and scenarios', text: 'The OPEC embargo and price shock, anticipated by Shell’s scenario planning group, ends cheap concession oil and pushes the Group towards non-OPEC provinces.', tag: 'crisis' },
    { year: 1979, title: 'Losses to nationalisation', text: 'The Iranian revolution and successive host-government takeovers strip the Group of much of its equity crude, forcing a rebuild around the North Sea, Brunei, Oman and Nigeria.', tag: 'crisis' },
    { year: 1985, title: 'Buy-in of Shell Oil in the US', text: 'The Group buys the 30.5% public minority of Shell Oil Company for about $5.7bn, taking full ownership of its large United States business after a contested tender.', tag: 'expansion' },
    { year: 1995, title: 'Brent Spar and Nigeria', text: 'Greenpeace’s occupation of the Brent Spar buoy forces Shell to abandon deep-sea disposal, and the execution of Ken Saro-Wiwa triggers a reputational crisis and a governance overhaul.', tag: 'crisis' },
    { year: 1998, title: 'Price crash and restructuring', text: 'Brent below $10 cuts Group net income to about $0.4bn; Shell launches deep cost cuts, asset sales and a simplified business-unit structure under new leadership.', tag: 'crisis' },
    { year: 2004, title: 'Reserves overstatement scandal', text: 'Shell restates proved reserves by about 4.5 billion barrels, the chairman and exploration head depart, and the FSA and SEC impose fines — the trigger for full unification.', tag: 'crisis' },
    { year: 2005, title: 'Unification as one company', text: 'Royal Dutch Shell plc replaces the 1907 dual-parent structure with a single company incorporated in England and headquartered in The Hague, with a unified board and share class.', tag: 'merger' },
    { year: 2011, title: 'Pearl GTL and LNG scale', text: 'The Pearl gas-to-liquids plant in Qatar starts up, the world’s largest, cementing an integrated gas strategy that made Shell the biggest non-state LNG trader.', tag: 'expansion' },
    { year: 2016, title: 'BG Group acquisition completed', text: 'Shell buys BG Group for about $53bn, the largest deal in its history, adding Brazilian pre-salt oil and Australian LNG and making Shell the world’s leading LNG player.', tag: 'merger' },
    { year: 2021, title: 'Hague climate ruling', text: 'A Dutch court orders Shell to cut group emissions 45% by 2030, overturned on appeal in 2024; months later Shell scraps its dual share structure and moves headquarters to London.', tag: 'transition' },
    { year: 2023, title: 'Sawan resets the strategy', text: 'New chief executive Wael Sawan prioritises value over volume, slowing low-carbon spending, holding oil output flat to 2030 and doubling down on LNG and shareholder distributions.', tag: 'strategy' },
    { year: 2025, title: 'Renewables build-out slows', text: 'Capacity in operation edges up to 4.2 GW while capacity under construction collapses from 4.0 GW to 1.9 GW, and Renewables and Energy Solutions capex falls to $1.87bn.', tag: 'strategy' }

  bp: [

    { year: 1970, title: 'Forties field discovered', text: 'The October discovery of Forties, the first major UK North Sea oilfield, would come onstream in November 1975 and peak at around 500,000 barrels a day.', tag: 'discovery' },

    { year: 1992, title: 'Record loss and boardroom coup', text: 'A slump, heavy debt from the 1980s buying spree and a dividend cut end Robert Horton’s chairmanship; BP begins deep cost cuts and disposals under David Simon.', tag: 'crisis' },
    { year: 1995, title: 'Browne takes the helm', text: 'John Browne becomes group chief executive, driving a low-cost, deal-led growth strategy and, in 1997, becoming the first major oil chief executive to accept the case for climate action.', tag: 'strategy' },
    { year: 1998, title: 'Merger with Amoco', text: 'BP and Amoco combine on 31 December in a roughly $48bn deal creating BP Amoco, the first of the supermajor mergers and a step change in United States upstream and gas scale.', tag: 'merger' },
    { year: 2000, title: 'ARCO and Burmah Castrol', text: 'BP acquires Atlantic Richfield, adding Alaskan production, and Burmah Castrol for lubricants; the enlarged group drops the Amoco name the following year.', tag: 'merger' },
    { year: 2001, title: 'Beyond Petroleum rebrand', text: 'BP adopts the green-and-yellow Helios sunburst and the Beyond Petroleum positioning, an early and much-debated attempt to reposition an oil major on climate.', tag: 'transition' },
    { year: 2003, title: 'TNK-BP joint venture', text: 'BP invests about $8bn for half of TNK-BP with the AAR group, the largest foreign investment in Russia at the time and for a decade roughly a quarter of BP’s output.', tag: 'expansion' },
    { year: 2005, title: 'Texas City refinery explosion', text: 'An explosion at the Texas City refinery on 23 March kills fifteen workers and injures scores, exposing systemic process-safety failures and a costly regulatory aftermath.', tag: 'crisis' },
    { year: 2010, title: 'Deepwater Horizon blowout', text: 'The Macondo blowout on 20 April kills eleven people and releases about 4.9 million barrels into the Gulf of Mexico; BP takes over $60bn of charges and sells roughly $38bn of assets.', tag: 'crisis' },
    { year: 2013, title: 'TNK-BP sold to Rosneft', text: 'BP exits TNK-BP for $12.3bn cash plus 18.5% of Rosneft, converting a contested joint venture into a minority stake that it wrote off after the 2022 invasion of Ukraine.', tag: 'strategy' },
    { year: 2020, title: 'Net zero by 2050 pledge', text: 'New chief executive Bernard Looney commits BP to net zero by 2050, a 40% cut in oil and gas output by 2030 and a tenfold rise in low-carbon investment, after $17.5bn of writedowns.', tag: 'transition' },
    { year: 2025, title: 'Reset back to oil and gas', text: 'BP scraps its transition targets in February, lifting oil and gas investment to about $10bn a year and cutting renewables spending, then sells sixty-five per cent of Castrol.', tag: 'strategy' }

  totalenergies: [

    { year: 1971, title: 'Algeria nationalises French oil', text: 'Boumediène’s government takes a 51% stake in French oil interests in February, stripping CFP of its principal producing base and forcing a pivot to the North Sea, West Africa and the Gulf.', tag: 'crisis' },
    { year: 1971, title: 'Ekofisk starts in the North Sea', text: 'Production begins at Ekofisk in the Norwegian North Sea, in which CFP holds an interest, delivering a politically secure non-OPEC source exactly as the Algerian position was lost.', tag: 'expansion' },

    { year: 1999, title: 'PetroFina acquired', text: 'Total completes the roughly $13bn acquisition of Belgium’s PetroFina, creating TotalFina and combining Total’s upstream with Fina’s Antwerp refining complex and American downstream assets.', tag: 'merger' },
    { year: 1999, title: 'Erika tanker breaks up', text: 'The chartered tanker Erika breaks apart off Brittany in December, spilling heavy fuel oil along the French Atlantic coast and producing a landmark French ruling on ecological damage.', tag: 'crisis' },
    { year: 2000, title: 'Elf Aquitaine taken over', text: 'After a bitter hostile bid launched in September 1999, TotalFina absorbs Elf Aquitaine in a transaction valued near $54bn, roughly doubling group output to about 2,100 kboe/d.', tag: 'merger' },
    { year: 2001, title: 'AZF Toulouse explosion', text: 'An ammonium nitrate store at the AZF fertiliser works in Toulouse, owned by a group subsidiary, explodes on 21 September, killing thirty-one people and devastating swathes of the city.', tag: 'crisis' },

<script>/* ==========================================================================
   Chart engine — hand-built SVG. No external dependencies.
   Mark specs follow the dataviz reference: 2px lines, ≥8px markers,
   4px rounded data-ends on bars, 2px surface gaps between stacked fills,
   recessive grid, selective direct labels, crosshair tooltip by default.
   ========================================================================== */

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, kids = []) => {
  const e = document.createElementNS(SVGNS, n);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
  (Array.isArray(kids) ? kids : [kids]).forEach(k => k && e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k));
  return e;
};
const txt = (s, a = {}) => el('text', a, String(s));

/* ------------------------------------------------------------ formatting */
const fmt = (v, d = 0) => v === null || v === undefined || Number.isNaN(v) ? '—'
  : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtC = (v, d = 1) => v === null || v === undefined ? '—' : (v < 0 ? '−' : '') + '$' + fmt(Math.abs(v), d) + 'bn';
const fmtSigned = (v, d = 1) => v === null || v === undefined ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);

/* --------------------------------------------------------------- tooltip */
const TIP = (() => {
  let node;
  const get = () => (node ||= document.getElementById('tip'));
  return {
    show(html, x, y) {
      const t = get(); t.innerHTML = html; t.style.opacity = '1';
      const r = t.getBoundingClientRect();
      let left = x + 16, top = y - r.height / 2;
      if (left + r.width > innerWidth - 10) left = x - r.width - 16;
      top = Math.max(8, Math.min(top, innerHeight - r.height - 8));
      t.style.left = left + 'px'; t.style.top = top + 'px';
    },
    hide() { const t = get(); if (t) t.style.opacity = '0'; }
  };
})();

/* ----------------------------------------------------------------- scales */
const scaleLinear = (d0, d1, r0, r1) => {
  const s = v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0);
  s.invert = p => d0 + (p - r0) / (r1 - r0 || 1) * (d1 - d0);
  s.domain = [d0, d1]; s.range = [r0, r1];
  return s;
};
function niceTicks(min, max, count = 5) {
  if (min === max) { min = Math.min(0, min); max = max || 1; }
  const span = max - min, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 1e6; v += step) out.push(+v.toFixed(10));
  return out;
}

/* --------------------------------------------------------------- helpers */
function frame(host, h) {
  host.innerHTML = '';
  const w = Math.max(280, host.clientWidth || 600);
  const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, height: h, class: 'chart-svg', role: 'img' });
  host.appendChild(svg);
  return { svg, w, h };
}
/* drop x ticks that would sit closer than `gap` px to the previous one */
function thinTicks(ticks, x, gap = 38) {
  const out = []; let last = -1e9;
  ticks.forEach((t, i) => {
    const px = x(t);
    if (px - last >= gap || i === ticks.length - 1) { if (i === ticks.length - 1 && px - last < gap && out.length) out.pop(); out.push(t); last = px; }
  });
  return out;
}
/* luminance-aware ink for text sitting on a coloured fill */
function inkOn(hex, alpha = 1) {
  const c = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255)
    .map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  const L = (.2126 * r + .7152 * g + .0722 * b) * alpha + (1 - alpha);
  return L > .179 ? '#0b0b0b' : '#ffffff';  // crossover where black beats white on contrast
}
/* push overlapping label anchors apart while staying inside [lo, hi] */
function declutter(anchors, minGap, lo, hi) {
  const n = anchors.length;
  if (!n) return [];
  /* when the band is too short for the labels, spread them evenly rather than
     letting the clamp stack them on top of each other */
  const gap = Math.min(minGap, (hi - lo) / Math.max(1, n - 1));
  const order = anchors.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
  const pos = order.map(([v]) => v);
  for (let k = 1; k < n; k++) pos[k] = Math.max(pos[k], pos[k - 1] + gap);   // forward
  pos[n - 1] = Math.min(pos[n - 1], hi);
  for (let k = n - 2; k >= 0; k--) pos[k] = Math.min(pos[k], pos[k + 1] - gap); // backward
  pos[0] = Math.max(pos[0], lo);
  for (let k = 1; k < n; k++) pos[k] = Math.max(pos[k], pos[k - 1] + gap);   // final forward
  const out = new Array(n);
  order.forEach(([, i], k) => { out[i] = pos[k]; });
  return out;
}

function axes(svg, { x, y, w, h, m, yTicks, xTicks, yFmt = v => fmt(v), xFmt = v => v, yTitle, hideY }) {
  const g = el('g');
  yTicks.forEach(t => {
    const py = y(t);
    if (py < m.t - 1 || py > h - m.b + 1) return;
    g.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: py, y2: py, class: 'grid-line' }));
    if (!hideY) g.appendChild(txt(yFmt(t), { x: m.l - 8, y: py + 3.5, class: 'tick', 'text-anchor': 'end' }));
  });
  g.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: h - m.b, y2: h - m.b, class: 'axis-line' }));
  thinTicks(xTicks, x).forEach(t => g.appendChild(txt(xFmt(t), { x: x(t), y: h - m.b + 15, class: 'tick', 'text-anchor': 'middle' })));
  if (yTitle) g.appendChild(txt(yTitle, { x: m.l - 8, y: m.t - 10, class: 'axis-title', 'text-anchor': 'end' }));
  svg.appendChild(g);
}
const pathD = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

/* =========================================================== LINE CHART = */
/* series: [{id,name,color,points:[{x,y,est,brk}]}]  */
function lineChart(host, opts) {
  const { series, height = 300, yTitle = '', unit = '', yFmt = v => fmt(v), decimals = 0,
    labelLast = true, xTickStep, yZero = false, annotations = [], tipNote = '' } = opts;

  const xs = [...new Set(series.flatMap(s => s.points.map(p => p.x)))].sort((a, b) => a - b);
  const vals = series.flatMap(s => s.points.filter(p => p.y != null).map(p => p.y));
  if (!vals.length || !xs.length) { host.innerHTML = '<div style="color:var(--ink-3);font-size:12px;padding:20px">No data for this selection.</div>'; return; }
  const lo = yZero ? Math.min(0, ...vals) : Math.min(...vals), hi = Math.max(...vals);
  const anyNeg = vals.some(v => v < 0);
  /* never open a negative axis for a strictly positive series */
  const padLo = yZero ? Math.min(0, lo) : Math.max(anyNeg ? -Infinity : 0, lo - (hi - lo) * .08);
  const yTicks = niceTicks(padLo, hi + (hi - lo) * .08, 5);
  const x = scaleLinear(xs[0], xs[xs.length - 1], m.l, w - m.r);
  const y = scaleLinear(yTicks[0], yTicks[yTicks.length - 1], h - m.b, m.t);

  const step = xTickStep || (xs.length > 22 ? 5 : xs.length > 12 ? 2 : 1);
  const xTicks = xs.filter((v, i) => i % step === 0 || i === xs.length - 1);
  axes(svg, { x, y, w, h, m, yTicks, xTicks, yFmt, yTitle });

  annotations.forEach(a => {
    if (a.x < xs[0] || a.x > xs[xs.length - 1]) return;
    const px = x(a.x);
    svg.appendChild(el('line', { x1: px, x2: px, y1: m.t, y2: h - m.b, stroke: 'var(--axis)', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
    svg.appendChild(txt(a.label, { x: px + 4, y: m.t + 9, class: 'note' }));
  });

  const gs = el('g');
  /* pre-compute de-cluttered anchors for the end labels */
  const ends = series.map(s => { const p = s.points.filter(q => q.y != null); return p.length ? p[p.length - 1] : null; });
  const labelY = labelLast
    ? declutter(ends.map(p => p ? y(p.y) : 0), 25, m.t + 10, h - m.b - 10)
    : [];
  series.forEach(s => {
    const pts = s.points.filter(p => p.y != null);
    if (!pts.length) return;
    // split into solid / estimated runs so proxy data is visually distinct
    let run = [], runEst = pts[0].est;
    const flush = () => {
      if (run.length > 1) gs.appendChild(el('path', { d: pathD(run), class: 'series-line', stroke: s.color, 'stroke-dasharray': runEst ? '5 4' : null, opacity: runEst ? .75 : 1 }));
      else if (run.length === 1) gs.appendChild(el('circle', { cx: run[0][0], cy: run[0][1], r: 2.5, fill: s.color }));
    };
    pts.forEach(p => {
      const isEst = !!p.est;
      if (isEst !== runEst) { run.push([x(p.x), y(p.y)]); flush(); run = [[x(p.x), y(p.y)]]; runEst = isEst; }
      else run.push([x(p.x), y(p.y)]);
    });
    flush();
    const last = pts[pts.length - 1];
    gs.appendChild(el('circle', { cx: x(last.x), cy: y(last.y), r: 4, fill: s.color, class: 'halo' }));
    if (labelLast) {
      const si = series.indexOf(s), ly = labelY[si], lx = x(last.x) + 11;
      if (Math.abs(ly - y(last.y)) > 3) // leader line when the label had to move
        gs.appendChild(el('path', { d: `M${x(last.x) + 5} ${y(last.y)} L${lx - 4} ${ly - 4}`, stroke: s.color, 'stroke-width': 1, fill: 'none', opacity: .55 }));
      gs.appendChild(txt(s.name, { x: lx, y: ly - 4, class: 'dlabel', fill: 'var(--ink-1)' }));
      gs.appendChild(txt(yFmt(last.y) + (unit ? ' ' + unit : ''), { x: lx, y: ly + 8, class: 'dlabel', fill: 'var(--ink-3)', 'font-weight': 500 }));
    }
  });
  svg.appendChild(gs);

  /* hover layer */
  const hov = el('g', { style: 'pointer-events:none' });
  const cross = el('line', { class: 'cross', y1: m.t, y2: h - m.b, opacity: 0 });
  hov.appendChild(cross);
  const dots = series.map(s => { const c = el('circle', { r: 4.5, fill: s.color, class: 'halo', opacity: 0 }); hov.appendChild(c); return c; });
  svg.appendChild(hov);
  const hit = el('rect', { x: m.l, y: m.t, width: Math.max(1, w - m.l - m.r), height: Math.max(1, h - m.t - m.b), class: 'hit' });
  svg.appendChild(hit);
  hit.addEventListener('mousemove', ev => {
    const box = svg.getBoundingClientRect(), sx = (ev.clientX - box.left) / box.width * w;
    const xv = xs.reduce((a, b) => Math.abs(b - x.invert(sx)) < Math.abs(a - x.invert(sx)) ? b : a, xs[0]);
    cross.setAttribute('x1', x(xv)); cross.setAttribute('x2', x(xv)); cross.setAttribute('opacity', 1);
    let rows = '', any = false;
    series.forEach((s, i) => {
      const p = s.points.find(q => q.x === xv);
      if (p && p.y != null) {
        any = true;
        dots[i].setAttribute('cx', x(xv)); dots[i].setAttribute('cy', y(p.y)); dots[i].setAttribute('opacity', 1);
        rows += `<div class="t-row"><span class="t-key" style="background:${s.color}"></span><span class="t-name">${s.name}${p.est ? ' *' : ''}</span><span class="t-val">${yFmt(p.y)}${unit ? ' ' + unit : ''}</span></div>`;
      } else dots[i].setAttribute('opacity', 0);
    });
    if (!any) { TIP.hide(); return; }
    TIP.show(`<div class="t-title">${xv}</div>${rows}${tipNote ? `<div class="t-note">${tipNote}</div>` : ''}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener('mouseleave', () => { TIP.hide(); cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); });
}

/* ==================================================== STACKED AREA CHART = */
function stackedArea(host, opts) {
  const { series, height = 300, yFmt = v => fmt(v), unit = '', yTitle = '' } = opts;
  const { svg, w, h } = frame(host, height);
  const m = { t: 18, r: 18, b: 26, l: 52 };
  const xs = [...new Set(series.flatMap(s => s.points.map(p => p.x)))].sort((a, b) => a - b);
  const totals = xs.map(xv => series.reduce((a, s) => a + (s.points.find(p => p.x === xv)?.y || 0), 0));
  const yTicks = niceTicks(0, Math.max(...totals) * 1.05, 5);
  const x = scaleLinear(xs[0], xs[xs.length - 1], m.l, w - m.r);
  const y = scaleLinear(0, yTicks[yTicks.length - 1], h - m.b, m.t);
  const step = xs.length > 22 ? 5 : xs.length > 12 ? 2 : 1;
  axes(svg, { x, y, w, h, m, yTicks, xTicks: xs.filter((v, i) => i % step === 0 || i === xs.length - 1), yFmt, yTitle });

  const base = new Map(xs.map(v => [v, 0]));
  series.forEach(s => {
    const top = [], bot = [];
    xs.forEach(xv => {
      const v = s.points.find(p => p.x === xv)?.y;
      const b = base.get(xv);
      if (v == null) return;
      top.push([x(xv), y(b + v)]); bot.push([x(xv), y(b)]);
      base.set(xv, b + v);
    });
    if (!top.length) return;
    svg.appendChild(el('path', { d: pathD(top) + ' ' + pathD(bot.reverse()).replace('M', 'L') + ' Z', fill: s.color, opacity: .9, stroke: 'var(--panel)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  });

  const hit = el('rect', { x: m.l, y: m.t, width: Math.max(1, w - m.l - m.r), height: Math.max(1, h - m.t - m.b), class: 'hit' });
  const cross = el('line', { class: 'cross', y1: m.t, y2: h - m.b, opacity: 0 });
  svg.appendChild(cross); svg.appendChild(hit);
  hit.addEventListener('mousemove', ev => {
    const box = svg.getBoundingClientRect(), sx = (ev.clientX - box.left) / box.width * w;
    const xv = xs.reduce((a, b) => Math.abs(b - x.invert(sx)) < Math.abs(a - x.invert(sx)) ? b : a, xs[0]);
    cross.setAttribute('x1', x(xv)); cross.setAttribute('x2', x(xv)); cross.setAttribute('opacity', 1);
    let tot = 0, rows = '';
    [...series].reverse().forEach(s => {
      const v = s.points.find(p => p.x === xv)?.y;
      if (v == null) return; tot += v;
      rows += `<div class="t-row"><span class="t-key" style="background:${s.color}"></span><span class="t-name">${s.name}</span><span class="t-val">${yFmt(v)}</span></div>`;
    });
    TIP.show(`<div class="t-title">${xv} — total ${yFmt(tot)} ${unit}</div>${rows}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener('mouseleave', () => { TIP.hide(); cross.setAttribute('opacity', 0); });
}

/* ============================================================ BAR CHART = */
/* horizontal bars, one row per item; 4px rounded data-end */
function barsH(host, opts) {
  const { items, height, yFmt = v => fmt(v), unit = '', showValue = true, max: fixedMax, note } = opts;
  const pad = { t: 8, r: 14, b: 18, l: 128 };
  const H = height || items.length * 30 + pad.t + pad.b;
  const rowH = Math.max(26, Math.min(46, (H - pad.t - pad.b) / Math.max(1, items.length)));
  const { svg, w, h } = frame(host, H);
  const vals = items.map(i => i.value ?? 0);
  const mx = fixedMax ?? Math.max(...vals, 0.0001);
  /* reserve enough room on the right for the longest value label, so labels
     always sit outside the bar rather than on top of a low-contrast fill */
  const longest = Math.max(...items.map(i => (i.value == null ? 'n/d' : yFmt(i.value) + (unit ? ' ' + unit : '')).length));
  const reserve = Math.min(140, longest * 6.8 + 14);
  const x = scaleLinear(0, mx, pad.l, Math.max(pad.l + 40, w - pad.r - reserve));
  items.forEach((it, i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    const g = el('g');
    const barH = Math.min(18, rowH - 12);
    g.appendChild(txt(it.label, { x: pad.l - 10, y: cy + 4, class: 'tick', 'text-anchor': 'end', fill: 'var(--ink-1)', 'font-size': 12, 'font-weight': 550 }));
    const bw = Math.max(2, x(it.value ?? 0) - pad.l);
    g.appendChild(el('rect', { x: pad.l, y: cy - barH / 2, width: bw, height: barH, rx: 4, fill: it.color, opacity: it.value == null ? .25 : 1 }));
    if (showValue) g.appendChild(txt(it.value == null ? 'n/d' : yFmt(it.value) + (unit ? ' ' + unit : ''),
      { x: pad.l + bw + 8, y: cy + 4, class: 'dlabel', fill: it.value == null ? 'var(--ink-3)' : 'var(--ink-1)' }));
    g.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${it.label}</div><div class="t-row"><span class="t-key" style="background:${it.color}"></span><span class="t-name">${it.metric || 'Value'}</span><span class="t-val">${it.value == null ? 'not disclosed' : yFmt(it.value) + ' ' + unit}</span></div>${it.note ? `<div class="t-note">${it.note}</div>` : ''}`, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    svg.appendChild(g);
  });
  svg.appendChild(el('line', { x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + items.length * rowH, class: 'axis-line' }));
  if (note) svg.appendChild(txt(note, { x: pad.l, y: H - 4, class: 'note' }));
}

/* ================================================== GROUPED COLUMN CHART = */
function columns(host, opts) {
  const { groups, series, height = 280, yFmt = v => fmt(v), unit = '', yTitle = '', signed = false } = opts;
  const { svg, w, h } = frame(host, height);
  const m = { t: 18, r: 16, b: 30, l: 54 };
  const vals = groups.flatMap(g => series.map(s => g.values[s.id])).filter(v => v != null);
  const lo = signed ? Math.min(0, ...vals) : 0, hi = Math.max(...vals, 0);
  const yTicks = niceTicks(lo, hi * 1.06 || 1, 5);
  const y = scaleLinear(yTicks[0], yTicks[yTicks.length - 1], h - m.b, m.t);
  const bandW = (w - m.l - m.r) / groups.length;
  const inner = Math.min(bandW * .8, series.length * 26);
  const bw = Math.max(3, inner / series.length - 2);

  yTicks.forEach(t => {
    const py = y(t);
    svg.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: py, y2: py, class: t === 0 ? 'axis-line' : 'grid-line' }));
    svg.appendChild(txt(yFmt(t), { x: m.l - 8, y: py + 3.5, class: 'tick', 'text-anchor': 'end' }));
  });
  if (yTitle) svg.appendChild(txt(yTitle, { x: m.l - 8, y: m.t - 10, class: 'axis-title', 'text-anchor': 'end' }));

  groups.forEach((g, gi) => {
    const cx = m.l + bandW * (gi + .5);
    svg.appendChild(txt(g.label, { x: cx, y: h - m.b + 16, class: 'tick', 'text-anchor': 'middle', 'font-size': 11 }));
    series.forEach((s, si) => {
      const v = g.values[s.id]; if (v == null) return;
      const x0 = cx - inner / 2 + si * (bw + 2);
      const y0 = Math.min(y(v), y(0)), hh = Math.max(1.5, Math.abs(y(v) - y(0)));
      const r = el('rect', { x: x0, y: y0, width: bw, height: hh, rx: Math.min(4, bw / 2), fill: s.color });
      r.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${g.label}</div><div class="t-row"><span class="t-key" style="background:${s.color}"></span><span class="t-name">${s.name}</span><span class="t-val">${yFmt(v)} ${unit}</span></div>`, ev.clientX, ev.clientY));
      r.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(r);
    });
  });
}

/* ============================================================== SPARKLINE */
function sparkline(host, points, color, height = 30) {
  const pts = points.filter(p => p.y != null);
  host.innerHTML = '';
  if (pts.length < 2) return;
  const w = Math.max(60, host.clientWidth || 110);
  const svg = el('svg', { viewBox: `0 0 ${w} ${height}`, height });
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x = scaleLinear(Math.min(...xs), Math.max(...xs), 1, w - 1);
  const y = scaleLinear(Math.min(...ys), Math.max(...ys), height - 3, 3);
  svg.appendChild(el('path', { d: pathD(pts.map(p => [x(p.x), y(p.y)])), fill: 'none', stroke: color, 'stroke-width': 1.75, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .85 }));
  const last = pts[pts.length - 1];
  svg.appendChild(el('circle', { cx: x(last.x), cy: y(last.y), r: 2.6, fill: color }));
  host.appendChild(svg);
}

/* ================================================================ SCATTER */
function scatter(host, opts) {
  const { points, height = 300, xFmt = v => fmt(v), yFmt = v => fmt(v), xTitle = '', yTitle = '' } = opts;
  const { svg, w, h } = frame(host, height);
  const m = { t: 26, r: 96, b: 40, l: 56 };
  const xv = points.map(p => p.x), yv = points.map(p => p.y);
  const xT = niceTicks(Math.min(...xv) * .85, Math.max(...xv) * 1.1, 5);
  const yT = niceTicks(Math.min(...yv) * .8, Math.max(...yv) * 1.1, 5);
  const x = scaleLinear(xT[0], xT[xT.length - 1], m.l, w - m.r);
  const y = scaleLinear(yT[0], yT[yT.length - 1], h - m.b, m.t);
  yT.forEach(t => { svg.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: y(t), y2: y(t), class: 'grid-line' })); svg.appendChild(txt(yFmt(t), { x: m.l - 8, y: y(t) + 3.5, class: 'tick', 'text-anchor': 'end' })); });
  xT.forEach(t => { svg.appendChild(el('line', { x1: x(t), x2: x(t), y1: m.t, y2: h - m.b, class: 'grid-line' })); svg.appendChild(txt(xFmt(t), { x: x(t), y: h - m.b + 15, class: 'tick', 'text-anchor': 'middle' })); });
  svg.appendChild(txt(xTitle, { x: (m.l + w - m.r) / 2, y: h - 6, class: 'axis-title', 'text-anchor': 'middle' }));
  svg.appendChild(txt(yTitle, { x: m.l, y: m.t - 8, class: 'axis-title', 'text-anchor': 'start' }));
  /* labels sit to the right of each mark, pushed apart so none overlap */
  const labY = declutter(points.map(p => y(p.y)), 15, m.t + 6, h - m.b - 4);
  points.forEach((p, i) => {
    const g = el('g');
    const rr = p.r || 9;
    const lx = x(p.x) + rr + 6, ly = labY[i];
    g.appendChild(el('circle', { cx: x(p.x), cy: y(p.y), r: rr, fill: p.color, opacity: .82, stroke: 'var(--panel)', 'stroke-width': 2 }));
    if (Math.abs(ly - y(p.y)) > 3)
      g.appendChild(el('path', { d: `M${x(p.x) + rr} ${y(p.y)} L${lx - 2} ${ly - 3}`, stroke: p.color, 'stroke-width': 1, fill: 'none', opacity: .55 }));
    g.appendChild(txt(p.label, { x: lx, y: ly + 1, class: 'dlabel', fill: 'var(--ink-1)' }));
    g.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${p.label}</div><div class="t-row"><span class="t-name">${xTitle}</span><span class="t-val">${xFmt(p.x)}</span></div><div class="t-row"><span class="t-name">${yTitle}</span><span class="t-val">${yFmt(p.y)}</span></div>${p.note ? `<div class="t-note">${p.note}</div>` : ''}`, ev.clientX, ev.clientY));
    g.addEventListener('mouseleave', TIP.hide);
    svg.appendChild(g);
  });
}

/* =============================================================== 100% BAR */
function splitBar(host, rows, height) {
  const rowH = 34, pad = { t: 4, l: 128, r: 16, b: 6 };
  const H = height || rows.length * rowH + pad.t + pad.b;
  const { svg, w } = frame(host, H);
  rows.forEach((r, i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    svg.appendChild(txt(r.label, { x: pad.l - 10, y: cy + 4, class: 'tick', 'text-anchor': 'end', fill: 'var(--ink-1)', 'font-size': 12, 'font-weight': 550 }));
    const total = r.parts.reduce((a, p) => a + p.value, 0) || 1;
    let cx = pad.l; const bw = w - pad.l - pad.r;
    r.parts.forEach((p, j) => {
      const pw = Math.max(0, p.value / total * bw - (j < r.parts.length - 1 ? 2 : 0));
      const rect = el('rect', { x: cx, y: cy - 9, width: pw, height: 18, rx: j === 0 || j === r.parts.length - 1 ? 4 : 0, fill: p.color, opacity: p.opacity ?? 1 });
      rect.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${r.label}</div><div class="t-row"><span class="t-key" style="background:${p.color}"></span><span class="t-name">${p.name}</span><span class="t-val">${fmt(p.value)} ${r.unit || ''} · ${(p.value / total * 100).toFixed(0)}%</span></div>`, ev.clientX, ev.clientY));
      rect.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(rect);
      if (pw > 42) svg.appendChild(txt((p.value / total * 100).toFixed(0) + '%', { x: cx + pw / 2, y: cy + 4, class: 'dlabel plain', fill: inkOn(p.color, p.opacity ?? 1), 'text-anchor': 'middle' }));
      cx += pw + 2;
    });
  });
}

</script>
<script>/* =============================================================== BUMP CHART
   Rank position over time. Rank 1 sits at the top; ties broken by value.
   rows: [{id,name,color,points:[{x, rank, value}]}]
   ========================================================================= */
function bumpChart(host, opts) {
  const { rows, height = 300, unit = '', valFmt = v => fmt(v) } = opts;
  const { svg, w, h } = frame(host, height);
  const m = { t: 20, r: 122, b: 26, l: 44 };
  const xs = [...new Set(rows.flatMap(r => r.points.map(p => p.x)))].sort((a, b) => a - b);
  if (!xs.length) return;
  const maxRank = Math.max(...rows.flatMap(r => r.points.map(p => p.rank)));
  const x = scaleLinear(xs[0], xs[xs.length - 1], m.l, w - m.r);
  const y = scaleLinear(1, maxRank, m.t, h - m.b);

  for (let r = 1; r <= maxRank; r++)
    svg.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: y(r), y2: y(r), class: 'grid-line' }));
  thinTicks(xs.filter((v, i) => i % Math.max(1, Math.round(xs.length / 8)) === 0 || i === xs.length - 1), x, 44)
    .forEach(t => svg.appendChild(txt(t, { x: x(t), y: h - m.b + 16, class: 'tick', 'text-anchor': 'middle' })));

  rows.forEach(r => {
    const pts = r.points.filter(p => p.rank != null).sort((a, b) => a.x - b.x);
    if (!pts.length) return;
    svg.appendChild(el('path', {
      d: pathD(pts.map(p => [x(p.x), y(p.rank)])), fill: 'none', stroke: r.color,
      'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .9
    }));
    pts.forEach(p => {
      const c = el('circle', { cx: x(p.x), cy: y(p.rank), r: 3.6, fill: r.color, class: 'halo' });
      c.addEventListener('mousemove', ev => TIP.show(
        `<div class="t-title">${p.x}</div><div class="t-row"><span class="t-key" style="background:${r.color}"></span><span class="t-name">${r.name}</span><span class="t-val">#${p.rank} · ${valFmt(p.value)} ${unit}</span></div>`, ev.clientX, ev.clientY));
      c.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(c);
    });
    const z = pts[pts.length - 1];
    svg.appendChild(txt(r.name, { x: x(z.x) + 12, y: y(z.rank) + 4, class: 'dlabel', fill: 'var(--ink-1)' }));
  });
  for (let r = 1; r <= maxRank; r++) {
    svg.appendChild(txt('#' + r, { x: m.l - 12, y: y(r) + 4, class: 'tick', 'text-anchor': 'end', 'font-weight': 700, fill: 'var(--ink-3)', 'font-size': 11 }));
  }
}

/* ============================================================== HEAT TABLE
   Companies down the side, metrics across the top. Each cell is scored 0-100
   within its own column and painted on a single-hue sequential ramp, so the
   colour encodes rank within a metric — never across metrics.
   ========================================================================= */
const SEQ = ['#eef4fd', '#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
function heatTable(host, opts) {
  const { rows, metrics } = opts;               // rows: [{id,name,color,values:{key:v}}]
  const norm = {};
  metrics.forEach(mt => {
    const vals = rows.map(r => r.values[mt.key]).filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    norm[mt.key] = v => v == null ? null : (hi === lo ? .5 : (mt.invert ? (hi - v) : (v - lo)) / (hi - lo));
  });
  host.innerHTML = `<table class="dt heat">
    <thead><tr><th class="sticky-l">Company</th>${metrics.map(mt => `<th title="${mt.hint || ''}">${mt.label}<span class="th-unit">${mt.unit || ''}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="sticky-l"><span class="co-cell">${LOGOS[r.id](24)}<span class="dot" style="background:${r.color}"></span>${r.name}</span></td>
      ${metrics.map(mt => {
    const v = r.values[mt.key], n = norm[mt.key](v);
    if (v == null) return `<td class="na">—</td>`;
    const step = SEQ[Math.min(SEQ.length - 1, Math.round(n * (SEQ.length - 1)))];
    return `<td class="heat-cell" style="--bg:${step};--fg:${n > .62 ? '#fff' : '#0b0b0b'}" title="${mt.label}: ${fmt(v, mt.d ?? 0)} ${mt.unit || ''}">${fmt(v, mt.d ?? 0)}</td>`;
  }).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ================================================================ DUMBBELL
   Two moments in time per company, joined by a rule — reads the change
   without asking anyone to compare bar lengths across a gap.
   ========================================================================= */
function dumbbell(host, opts) {
  const { items, height, yFmt = v => fmt(v), unit = '', labelA = 'start', labelB = 'end' } = opts;
  const pad = { t: 16, r: 16, b: 22, l: 126 };
  const H = height || items.length * 34 + pad.t + pad.b;
  const rowH = Math.max(26, Math.min(46, (H - pad.t - pad.b) / Math.max(1, items.length)));
  const { svg, w } = frame(host, H);
  const vals = items.flatMap(i => [i.a, i.b]).filter(v => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const reserve = 62;
  const x = scaleLinear(Math.min(0, lo), hi, pad.l, w - pad.r - reserve);

  items.forEach((it, i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    const g = el('g');
    g.appendChild(txt(it.label, { x: pad.l - 10, y: cy + 4, class: 'tick', 'text-anchor': 'end', fill: 'var(--ink-1)', 'font-size': 12, 'font-weight': 550 }));
    if (it.a != null && it.b != null) {
      const grew = it.b >= it.a;
      g.appendChild(el('line', { x1: x(it.a), x2: x(it.b), y1: cy, y2: cy, stroke: it.color, 'stroke-width': 3, opacity: .3, 'stroke-linecap': 'round' }));
      g.appendChild(el('circle', { cx: x(it.a), cy, r: 5, fill: 'var(--panel)', stroke: it.color, 'stroke-width': 2.2 }));
      g.appendChild(el('circle', { cx: x(it.b), cy, r: 6, fill: it.color, class: 'halo' }));
      const pct = it.a ? (it.b - it.a) / Math.abs(it.a) * 100 : null;
      g.appendChild(txt(pct == null ? '' : (pct > 0 ? '+' : pct < 0 ? '−' : '') + Math.abs(pct).toFixed(0) + '%',
        { x: w - pad.r, y: cy + 4, class: 'dlabel', 'text-anchor': 'end', fill: grew ? 'var(--up)' : 'var(--down)' }));
      g.addEventListener('mousemove', ev => TIP.show(
        `<div class="t-title">${it.label}</div><div class="t-row"><span class="t-name">${it.labelA || labelA}</span><span class="t-val">${yFmt(it.a)} ${unit}</span></div><div class="t-row"><span class="t-name">${it.labelB || labelB}</span><span class="t-val">${yFmt(it.b)} ${unit}</span></div>`, ev.clientX, ev.clientY));
      g.addEventListener('mouseleave', TIP.hide);
    } else {
      g.appendChild(txt('not comparable', { x: pad.l + 6, y: cy + 4, class: 'tick', fill: 'var(--ink-3)' }));
    }
    svg.appendChild(g);
  });
  svg.appendChild(el('line', { x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + items.length * rowH, class: 'axis-line' }));
}

/* ========================================================== LEAGUE TABLE =
   Ranked rows with an in-cell bar, a delta and a sparkline: the densest
   honest way to answer "who is biggest, who is moving".
   ========================================================================= */
function leagueTable(host, opts) {
  const { rows, unit = '', valFmt = v => fmt(v), sparkYears = [] } = opts;
  const mx = Math.max(...rows.map(r => r.value ?? 0), 1);
  host.innerHTML = `<table class="dt league"><thead><tr>
      <th style="width:26px"></th><th class="sticky-l">Company</th><th style="width:34%">${opts.metric || 'Value'}<span class="th-unit">${unit}</span></th>
      <th style="width:74px">vs ${opts.prevLabel || 'prior'}</th><th style="width:96px">Trend</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td class="rank">${i + 1}</td>
      <td class="sticky-l"><span class="co-cell">${LOGOS[r.id](28)}<span class="dot" style="background:${r.color}"></span>${r.name}</span></td>
      <td class="barcell"><span class="bar" style="width:${Math.max(2, (r.value ?? 0) / mx * 100)}%;background:${r.color}"></span><b>${valFmt(r.value)}</b></td>
      <td>${r.delta == null ? '<span class="delta flat">—</span>' : `<span class="delta ${r.delta > .3 ? 'pos' : r.delta < -.3 ? 'neg' : 'flat'}">${r.delta > 0 ? '▲' : r.delta < 0 ? '▼' : '■'} ${Math.abs(r.delta).toFixed(1)}%</span>`}</td>
      <td><span class="sparkhost" data-co="${r.id}"></span></td>
    </tr>`).join('')}</tbody></table>`;
  host.querySelectorAll('.sparkhost').forEach(n => {
    const r = rows.find(q => q.id === n.dataset.co);
    if (r?.spark?.length) sparkline(n, r.spark, r.color, 26);
  });
}

/* ================================================================ ERA GANTT
   One row per company across the whole span since the oldest foundation.
   Bands are the strategic eras; dots are the dated milestones, coloured by
   what kind of event they were.
   ========================================================================= */
function eraGantt(host, opts) {
  const { rows, from, to, height, onPick } = opts;
  const rowH = 54, pad = { t: 30, r: 18, b: 26, l: 124 };
  const H = height || rows.length * rowH + pad.t + pad.b;
  const { svg, w } = frame(host, H);
  const x = scaleLinear(from, to, pad.l, w - pad.r);

  /* decade grid */
  for (let y = Math.ceil(from / 20) * 20; y <= to; y += 20) {
    svg.appendChild(el('line', { x1: x(y), x2: x(y), y1: pad.t - 12, y2: H - pad.b + 2, class: 'grid-line' }));
    svg.appendChild(txt(y, { x: x(y), y: pad.t - 16, class: 'tick', 'text-anchor': 'middle' }));
    svg.appendChild(txt(y, { x: x(y), y: H - pad.b + 15, class: 'tick', 'text-anchor': 'middle' }));
  }

  rows.forEach((r, i) => {
    const top = pad.t + i * rowH, cy = top + 17;
    svg.appendChild(txt(r.name, { x: pad.l - 10, y: cy + 4, class: 'tick', 'text-anchor': 'end', fill: 'var(--ink-1)', 'font-size': 12, 'font-weight': 600 }));
    svg.appendChild(txt('since ' + r.founded, { x: pad.l - 10, y: cy + 17, class: 'tick', 'text-anchor': 'end', 'font-size': 9.5 }));

    (r.eras || []).forEach((e, k) => {
      const x0 = x(e.from), x1 = x(Math.min(e.to, to));
      const cid = `eg${i}_${k}`;
      const g = el('g', { 'clip-path': `url(#${cid})` });
      const cp = el('clipPath', { id: cid });
      cp.appendChild(el('rect', { x: x0, y: cy - 12, width: Math.max(2, x1 - x0 - 2), height: 24, rx: 4 }));
      svg.appendChild(cp);
      g.appendChild(el('rect', { x: x0, y: cy - 11, width: Math.max(2, x1 - x0 - 2), height: 22, rx: 4, fill: r.color, opacity: .16 + (k % 2) * .12 }));
      const room = Math.floor((x1 - x0 - 14) / 5.9);          // conservative glyph width at 9.5px
      if (room > 5) g.appendChild(txt(e.label.length > room ? e.label.slice(0, room - 1).trimEnd() + '…' : e.label,
        { x: x0 + 7, y: cy + 4, class: 'dlabel plain', fill: 'var(--ink-1)', 'font-size': 9.5, 'font-weight': 600 }));
      g.addEventListener('mousemove', ev => TIP.show(
        `<div class="t-title">${r.name} · ${e.from}–${e.to}</div><div style="font-weight:640;margin-bottom:3px">${e.label}</div><div class="t-note" style="margin-top:0">${e.note}</div>`, ev.clientX, ev.clientY));
      g.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(g);
    });

    /* milestone dots, nudged apart so dense decades stay readable */
    const evs = (r.events || []).slice().sort((a, b) => a.year - b.year);
    const px = declutter(evs.map(e => x(e.year)), 8, pad.l, w - pad.r);
    evs.forEach((e, k) => {
      const c = el('circle', { cx: px[k], cy: cy + 20, r: 4, fill: (TAGS[e.tag] || {}).color || '#888', stroke: 'var(--panel)', 'stroke-width': 1.5, style: 'cursor:pointer' });
      c.addEventListener('mousemove', ev => TIP.show(
        `<div class="t-title">${e.year} · ${r.name}</div><div style="font-weight:640;margin-bottom:3px">${e.title}</div><div class="t-note" style="margin-top:0">${e.text}</div>`, ev.clientX, ev.clientY));
      c.addEventListener('mouseleave', TIP.hide);
      if (onPick) c.addEventListener('click', () => onPick(r.id, e.year));
      svg.appendChild(c);
    });
  });
}

/* ====================================================== STACKED H-BARS ==== */
function stackedBarsH(host, opts) {
  const { items, keys, height, unit = '', yFmt = v => fmt(v), showTotal = true } = opts;
  const pad = { t: 8, r: 14, b: 18, l: 126 };
  const H = height || items.length * 32 + pad.t + pad.b;
  const rowH = Math.max(24, Math.min(44, (H - pad.t - pad.b) / Math.max(1, items.length)));
  const { svg, w } = frame(host, H);
  const totals = items.map(i => keys.reduce((a, [k]) => a + (i.values[k] || 0), 0));
  const mx = Math.max(...totals, 1);
  const reserve = showTotal ? 70 : 12;
  const x = scaleLinear(0, mx, pad.l, Math.max(pad.l + 40, w - pad.r - reserve));
  items.forEach((it, i) => {
    const cy = pad.t + i * rowH + rowH / 2, barH = Math.min(18, rowH - 10);
    svg.appendChild(txt(it.label, { x: pad.l - 10, y: cy + 4, class: 'tick', 'text-anchor': 'end', fill: 'var(--ink-1)', 'font-size': 12, 'font-weight': 550 }));
    if (!totals[i]) { svg.appendChild(txt('not disclosed by region', { x: pad.l + 6, y: cy + 4, class: 'tick', fill: 'var(--ink-3)' })); return; }
    let cx = pad.l;
    keys.forEach(([k, name, col]) => {
      const v = it.values[k]; if (!v) return;
      const bw = Math.max(1, x(v) - pad.l - 2);
      const r = el('rect', { x: cx, y: cy - barH / 2, width: bw, height: barH, rx: 3, fill: col });
      r.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${it.label}</div><div class="t-row"><span class="t-key" style="background:${col}"></span><span class="t-name">${name}</span><span class="t-val">${yFmt(v)} ${unit} · ${(v / totals[i] * 100).toFixed(0)}%</span></div>${it.note ? `<div class="t-note">${it.note}</div>` : ''}`, ev.clientX, ev.clientY));
      r.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(r); cx += bw + 2;
    });
    if (showTotal) svg.appendChild(txt(yFmt(totals[i]), { x: cx + 8, y: cy + 4, class: 'dlabel', fill: 'var(--ink-1)' }));
  });
  svg.appendChild(el('line', { x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + items.length * rowH, class: 'axis-line' }));
}

/* ============================================== STACKED COLUMNS (by year) = */
function stackedColumns(host, opts) {
  const { groups, keys, height = 260, yFmt = v => fmt(v), unit = '', yTitle = '' } = opts;
  const { svg, w, h } = frame(host, height);
  const m = { t: 18, r: 16, b: 30, l: 54 };
  const tot = groups.map(g => keys.reduce((a, [k]) => a + Math.max(0, g.values[k] || 0), 0));
  const neg = groups.map(g => keys.reduce((a, [k]) => a + Math.min(0, g.values[k] || 0), 0));
  const yTicks = niceTicks(Math.min(0, ...neg) * 1.05, Math.max(...tot, 1) * 1.06, 5);
  const y = scaleLinear(yTicks[0], yTicks[yTicks.length - 1], h - m.b, m.t);
  const bandW = (w - m.l - m.r) / groups.length, bw = Math.min(bandW * .62, 74);
  yTicks.forEach(t => {
    svg.appendChild(el('line', { x1: m.l, x2: w - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'axis-line' : 'grid-line' }));
    svg.appendChild(txt(yFmt(t), { x: m.l - 8, y: y(t) + 3.5, class: 'tick', 'text-anchor': 'end' }));
  });
  if (yTitle) svg.appendChild(txt(yTitle, { x: m.l - 8, y: m.t - 10, class: 'axis-title', 'text-anchor': 'end' }));
  groups.forEach((g, gi) => {
    const cx = m.l + bandW * (gi + .5);
    svg.appendChild(txt(g.label, { x: cx, y: h - m.b + 16, class: 'tick', 'text-anchor': 'middle', 'font-size': 11 }));
    let up = 0, down = 0;
    keys.forEach(([k, name, col]) => {
      const v = g.values[k]; if (v == null || v === 0) return;
      const base = v > 0 ? up : down, y0 = y(base + v), y1 = y(base);
      const r = el('rect', { x: cx - bw / 2, y: Math.min(y0, y1), width: bw, height: Math.max(1.5, Math.abs(y1 - y0) - 2), rx: 3, fill: col });
      r.addEventListener('mousemove', ev => TIP.show(`<div class="t-title">${g.label}</div><div class="t-row"><span class="t-key" style="background:${col}"></span><span class="t-name">${name}</span><span class="t-val">${yFmt(v)} ${unit}</span></div>`, ev.clientX, ev.clientY));
      r.addEventListener('mouseleave', TIP.hide);
      svg.appendChild(r);
      if (v > 0) up += v; else down += v;
    });
  });
}
</script>
